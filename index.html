round:#10263e77;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{background:white;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 70px #10263e44}.modal h3{margin:0 0 18px}.closex{float:right;background:#eef2f6;color:#28445e;padding:6px 10px}.reportbox{background:#f8fafc;border:1px solid var(--line);padding:18px;border-radius:12px;line-height:1.65;font-size:13px;white-space:pre-wrap}.hidden{display:none!important}
 .loginbar{display:flex;align-items:center;gap:8px}.loginbar button{padding:8px 11px;font-size:11px}.eventcard{display:flex;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:white}.datebox{flex:none;width:58px;height:64px;border-radius:10px;background:#e8f0f8;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center}.datebox b{font-size:23px;line-height:1}.datebox small{font-size:10px;font-weight:800;text-transform:uppercase;margin-top:4px}.eventbody{flex:1;min-width:0}.eventbody h4{margin:2px 0 5px;font-size:14px}.eventbody p{font-size:12px;color:var(--muted);margin:0 0 7px;line-height:1.5}.chatlayout{display:grid;grid-template-columns:270px 1fr;min-height:490px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:white}.chatlist{border-right:1px solid var(--line);padding:12px}.chatcontact{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:white;color:var(--ink);padding:12px;border-radius:10px;margin:3px 0}.chatcontact.active,.chatcontact:hover{background:#edf4fa}.contactavatar{width:35px;height:35px;flex:none;border-radius:50%;background:#e5eef7;color:var(--navy);display:grid;place-items:center;font-weight:800}.contactmeta{min-width:0}.contactmeta b{display:block;font-size:12px}.contactmeta small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.chatwindow{display:flex;flex-direction:column;min-width:0}.chathead{padding:15px;border-bottom:1px solid var(--line);font-weight:800;font-size:13px}.chatmessages{flex:1;min-height:280px;max-height:420px;overflow:auto;padding:16px;background:#f8fafc}.bubble{max-width:82%;padding:10px 12px;border-radius:12px;background:white;border:1px solid var(--line);margin:8px 0;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:#e4f1fb;border-color:#c4dff3}.bubble small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.chatcompose{ /* District dashboard layout: preserve original brand colors */
.app{grid-template-columns:258px minmax(0,1fr)}
.sidebar{height:100vh;position:sticky;top:0;overflow-y:auto;padding:20px 13px 14px;gap:12px;scrollbar-width:thin;scrollbar-color:#ffffff44 transparent}
.sidebar .brand{padding:8px 10px 18px;margin-bottom:2px}
.sidebar .navrow{display:flex;flex-direction:column;gap:3px!important}
.sidebar .navbtn{min-height:39px;padding:10px 12px;border-radius:9px;font-size:12px}
.sidebar .navlabel{margin:9px 10px 2px}
.sidebarbottom{margin-top:auto;border-top:1px solid #ffffff2c;padding-top:10px}
.sidebarbottom .sidebarfoot{margin-top:0;padding:8px 10px 12px;font-size:10px}
.sidebarlogout{display:flex;align-items:center;gap:12px;width:100%;background:transparent;color:#ffe3de;text-align:left;border:1px solid #ffffff30;border-radius:9px;padding:12px;font-size:13px}
.sidebarlogout:hover,.sidebarlogout:focus-visible{background:#ffffff20;color:white}
.sidebarlogout span{font-size:20px;line-height:1}
.topbar{height:70px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #10263e0b}
.content{max-width:1600px;padding:24px 26px}
.panel,.stat{box-shadow:0 2px 10px #12345a0a}
.stat{border-radius:12px}
.panel{border-radius:14px}
@media(max-width:950px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative;overflow:visible}.sidebar .navrow{flex-direction:row!important;overflow:auto}.sidebarbottom{margin-top:4px;display:flex;align-items:center;justify-content:space-between;gap:12px}.sidebarbottom .sidebarfoot{display:block;padding:5px 10px}.sidebarlogout{width:auto;white-space:nowrap}.topbar{position:relative}}
@media(max-width:560px){.sidebarbottom .sidebarfoot{display:none}.sidebarbottom{justify-content:flex-end}.content{padding:16px}}

/* Larger, clearer sidebar navigation labels and symbols */
@media (min-width:951px){
  .app{grid-template-columns:305px minmax(0,1fr)}
  .sidebar{padding:22px 15px 16px}
}
.sidebar .navbtn{font-size:15px;font-weight:750;min-height:53px;padding:13px 14px;gap:15px;line-height:1.35}
.sidebar .navbtn span{display:inline-flex;align-items:center;justify-content:center;flex:0 0 30px;width:30px;min-width:30px;font-size:24px;line-height:1.1}
.sidebar .navlabel{font-size:12px;font-weight:800;letter-spacing:1.5px;margin:13px 12px 5px}
.sidebar .brand h1{font-size:20px}
.sidebar .brand small{font-size:12px}
.sidebar .brandmark{width:48px;height:48px;font-size:23px;flex-shrink:0}
.sidebarlogout{font-size:16px;font-weight:750;min-height:54px;padding:13px 14px;gap:15px}
.sidebarlogout span{font-size:26px;display:inline-flex;justify-content:center;width:30px}
@media(max-width:950px){
  .sidebar .navbtn{font-size:14px;min-height:48px;padding:11px 13px}
  .sidebar .navbtn span{font-size:22px;flex-basis:28px;width:28px;min-width:28px}
}

/* Project e-NEXUS school and district branding */
.enexus-brand{display:flex!important;flex-direction:column;align-items:stretch!important;gap:12px!important}
.enexus-brand-title{display:flex;align-items:center;gap:12px}
.enexus-seals{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.enexus-seals img{width:78px;height:78px;object-fit:contain;background:white;border-radius:50%;padding:5px;box-shadow:0 2px 10px #0002}
.sidebar .enexus-seals img{width:86px;height:86px}
.loginbox .enexus-seals{margin:4px 0 18px}
.loginbox .enexus-seals img{width:74px;height:74px;border:1px solid #e3e9ef}
@media(max-width:560px){.sidebar .enexus-seals img{width:68px;height:68px}}

/* Detailed vector navigation icons: no external image or icon library needed */
.sidebar .navbtn .nav-icon-frame,.sidebarlogout .nav-icon-frame{width:37px;height:37px;min-width:37px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(229,181,75,.13);color:#f4c967;border:1px solid rgba(229,181,75,.22);flex-shrink:0}
.sidebar .navbtn .enexus-nav-icon,.sidebarlogout .enexus-nav-icon{width:25px;height:25px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.sidebar .navbtn.active .nav-icon-frame,.sidebar .navbtn:hover .nav-icon-frame{background:#e5b54b;color:#12345a;border-color:#f5d78d}
.sidebarlogout .nav-icon-frame{color:#ffd0c8;background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18)}
.sidebar .navbtn{gap:13px}
</style>

  <button class="navbtn" data-page="settings"><span class="nav-icon-frame"><svg class="enexus-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4l.7 2.4 2 .9 2.2-1.2 2.8 2.8-1.2 2.2.9 2L24 12v0l-2.6.7-.9 2 1.2 2.2-2.8 2.8-2.2-1.2-2 .9L14 22h-4l-.7-2.6-2-.9-2.2 1.2-2.8-2.8 1.2-2.2-.9-2L0 12l2.6-.9.9-2-1.2-2.2 2.8-2.8 2.2 1.2 2-.9Z" transform="translate(1.2 1.2) scale(.9)"/><circle cx="12" cy="12" r="3"/></svg></span> Settings & Data</button>
  <div class="sidebarbottom">
  <div class="sidebarfoot">Project e-NEXUS • Aliaga District<br>Unified School Services</div>
  <button class="sidebarlogout" id="logoutBtn" type="button" onclick="logout()"><span class="nav-icon-frame"><svg class="enexus-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5M14 7l5 5-5 5M19 12H9"/></svg></span> Logout</button>
</div>
</aside>
<main class="main">
  <header class="topbar"><div><div class="eyebrow">Electronic Network for Excellence</div><h2 id="pageTitle">Dashboard</h2></div><div class="topright"><span id="userLabel" class="rolelabel">Project workspace</span><div class="avatar" id="userAvatar">eN</div></div></header>
  <div class="content" id="content"></div>
  <div class="footer">Project e-NEXUS • Projects & Programs • Monitoring & Evaluation • Document Tracing & Management</div>
</main>
</div>
<div class="modalback" id="modalback"><div class="modal"><button class="closex" onclick="closeModal()">✕</button><div id="modalcontent"></div></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const seed={
 projects:[],
 indicators:[],
 docs:[],
 activities:[],
 users:[],
 chats:{},
 activity:[]
};
let db;
try{db=JSON.parse(localStorage.getItem('enexusData'))||structuredClone(seed)}catch(e){db=JSON.parse(JSON.stringify(seed))}
db.activities ||= JSON.parse(JSON.stringify(seed.activities));
db.users ||= JSON.parse(JSON.stringify(seed.users));
db.chats ||= {};
// One-time cleanup of legacy sample content stored by older website versions.
// Do not erase genuine records or messages from real registered users.
const enexusLegacySeedIds = {
 projects: new Set(['PRJ-001','PRJ-002']),
 indicators: new Set(['IND-001','IND-002']),
 docs: new Set(['DOC-2026-001','DOC-2026-002']),
 activities: new Set(['ACT-001','ACT-002','ACT-003']),
 users: new Set(['USR-001','USR-002','USR-003'])
};
for(const [kind, ids] of Object.entries(enexusLegacySeedIds)) {
 if(Array.isArray(db[kind])) db[kind]=db[kind].filter(item=>!ids.has(String(item?.id||'')));
}
const enexusSampleTexts=new Set([
 'Welcome to the Project e-NEXUS coordination space. Please use this sample chat to test partner communication.',
 'We can coordinate upcoming activities and program support here.',
 'Please share project updates and action items in the appropriate channel.'
]);
for(const [channel, messages] of Object.entries(db.chats)) {
 if(!Array.isArray(messages)) {delete db.chats[channel];continue;}
 const kept=messages.filter(m=>m &&
   !/^(school personnel demo|partner agency demo)$/i.test(String(m.sender||'').trim()) &&
   !(m.time==='Sample message' && enexusSampleTexts.has(m.text)));
 if(kept.length) db.chats[channel]=kept;
 else delete db.chats[channel];
}
// Persist cleanup so removed demonstration content does not return on refresh.
try{localStorage.setItem('enexusData',JSON.stringify(db));}catch(e){console.warn('Could not persist legacy sample cleanup',e);}

let currentUser=null, currentChat=Object.keys(db.chats)[0]||'';
let page='login', query='', filter='All';
function save(){const local={...db,projects:db.projects.filter(x=>!String(x.id).startsWith('CLOUD-')),docs:db.docs.filter(x=>!String(x.id).startsWith('LINK-')),indicators:db.indicators.filter(x=>!String(x.id).startsWith('LINK-'))};localStorage.setItem('enexusData',JSON.stringify(local))}
function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function log(msg){db.activity.unshift({date:new Date().toLocaleString(),msg});db.activity=db.activity.slice(0,30);save()}
function statusPill(s){let cls=/complete|approved|released|received|closed/i.test(s)?'green':/overdue|rejected|returned/i.test(s)?'red':/review|progress|pending|routed/i.test(s)?'amber':'';return `<span class="pill ${cls}">${esc(s)}</span>`}
function projectName(id){return db.projects.find(p=>p.id===id)?.name||'Unassigned'}
// UI navigation only: Supabase RLS must independently enforce per-school data access.
const ENEXUS_ADMIN_ONLY_PAGES=new Set(['dashboard','activities','updates','transparency','users','settings']);
const ENEXUS_ICT_PAGES=new Set(['monitoring','records']);
function isSystemAdmin(){return currentUser?.role==='Administrator';}
function isICTCoordinator(){return !!currentUser && !isSystemAdmin() && (currentUser.role==='ICT Coordinator Moderator'||(currentUser.role==='School Personnel'&&currentUser.position_in_school==='ICT Coordinator'));}
function canViewPage(p){if(isSystemAdmin())return true;if(isICTCoordinator())return ENEXUS_ICT_PAGES.has(p);if(ENEXUS_ICT_PAGES.has(p))return false;if(ENEXUS_ADMIN_ONLY_PAGES.has(p))return false;return ['projects','documents','community','announcements','orgchart','reports'].includes(p);}
function canEditMonitoring(){return isSystemAdmin();}
function canEditTracing(){return isSystemAdmin() || (currentUser?.role==='Program Coordinator') || (currentUser?.role==='ICT Coordinator Moderator') || (currentUser?.position_in_school==='Program Coordinator' && currentUser?.role==='School Personnel') || (currentUser?.position_in_school==='ICT Coordinator' && currentUser?.role==='School Personnel');}
function requireModuleEdit(kind){if(kind==='monitoring'&&!canEditMonitoring()){toast('Only the District System Administrator can edit Monitoring & Evaluation.');return false;}if(kind==='documents'&&!canEditTracing()){toast('Only the Administrator, Program Coordinator, or ICT Coordinator can edit Document Tracing.');return false;}return true;}
function schoolScopedRows(rows){if(!isICTCoordinator())return rows;return rows.filter(r=>r.school_name && r.school_name===currentUser.school_name);}
function setPage(p){if(!currentUser){showLogin();return}if(!canViewPage(p)){toast('This section is not available for your account.');return}page=p;query='';document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function render(){
 if(!currentUser){showLogin();return}
 $('#userLabel').textContent=currentUser.name+' • '+currentUser.role;
 $('#userAvatar').textContent=(currentUser.name||'eN').split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase();
 document.querySelectorAll('.navbtn[data-page]').forEach(b=>{b.classList.toggle('hidden',!canViewPage(b.dataset.page));b.classList.toggle('active',b.dataset.page===page);});
 document.querySelectorAll('.navlabel').forEach(label=>{if(label.textContent.trim()==='ADMINISTRATION')label.classList.toggle('hidden',!isSystemAdmin());});
 if(!canViewPage(page))page='projects';
 let titles={dashboard:'Dashboard',projects:'Projects & Programs',monitoring:'Monitoring & Evaluation',reports:'Reports',documents:'Document Tracing',records:'Records & Retrieval',settings:'Settings & Data',activities:'Activities & Calendar',community:'Partner Chat',users:'Users & Access',announcements:'Announcements',orgchart:'Organizational Chart',updates:'Project Status Updates',transparency:'Transparency Register'};
 $('#pageTitle').textContent=titles[page]||'Projects & Programs';
 let f={dashboard:dashboardPage,projects:projectsPage,monitoring:monitorPage,reports:reportsPage,documents:documentsPage,records:recordsPage,settings:settingsPage,activities:activitiesPage,community:communityPage,users:usersPage,announcements:announcementsPage,orgchart:orgchartPage,updates:updatesPage,transparency:transparencyPage};
 $('#content').innerHTML=(page==='monitoring'&&isICTCoordinator())?ictMonitoringPage():(page==='records'&&isICTCoordinator())?ictRecordsPage():f[page]();
 wire();
 if(page==='users')loadUsersDirectory();
 if(['announcements','updates','transparency'].includes(page))loadCloudModule(page);
 if(page==='orgchart')loadOrgChart();
 if(['projects','monitoring','documents','dashboard','reports','records'].includes(page))loadSharedProjects();
}
function ictMonitoringPage(){
 const rows=schoolScopedRows(db.indicators).filter(x=>JSON.stringify(x).toLowerCase().includes(query.toLowerCase()));
 return `<h3 class="sectiontitle">Monitoring & Evaluation</h3><p class="sectiondesc">${esc(currentUser.school_name)} • School records</p><div class="toolbar"><input id="search" placeholder="Search indicators…" value="${esc(query)}"></div><div class="tablewrap"><table><thead><tr><th>Indicator</th><th>Project</th><th>Target</th><th>Actual</th><th>Achievement</th><th>Updated</th></tr></thead><tbody>${rows.map(i=>{let pct=Number(i.target)>0?Math.round(Number(i.actual)/Number(i.target)*100):0;return `<tr><td>${esc(i.name)}</td><td>${esc(projectName(i.project))}</td><td>${esc(i.target)}</td><td>${esc(i.actual)}</td><td>${pct}%</td><td>${esc(i.date||'—')}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No school-linked indicators available.</td></tr>'}</tbody></table></div>`;
}
function ictRecordsPage(){
 const rows=schoolScopedRows(db.docs).filter(x=>JSON.stringify(x).toLowerCase().includes(query.toLowerCase()));
 return `<h3 class="sectiontitle">Records & Retrieval</h3><p class="sectiondesc">${esc(currentUser.school_name)} • School records</p><div class="toolbar"><input id="search" placeholder="Search school records…" value="${esc(query)}"></div><div class="tablewrap"><table><thead><tr><th>Record ID</th><th>Document</th><th>Type</th><th>Status</th><th>Location</th></tr></thead><tbody>${rows.map(d=>`<tr><td>${esc(d.id)}</td><td>${esc(d.title)}</td><td>${esc(d.type)}</td><td>${statusPill(d.status)}</td><td>${esc(d.location||'—')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No school-linked records available.</td></tr>'}</tbody></table></div>`;
}
function dashboardPage(){
 let active=db.projects.filter(p=>p.status==='In Progress').length, pending=db.docs.filter(d=>!/complete|approved|released|closed/i.test(d.status)).length, avg=db.projects.length?Math.round(db.projects.reduce((a,p)=>a+Number(p.progress||0),0)/db.projects.length):0;
 return `<section class="welcome"><div><div class="tag">APPROVED PROJECT • DIGITAL WORKSPACE</div><h3>Welcome to Project e-NEXUS</h3><p>A unified workspace for planning and monitoring programs, evaluating performance, routing documents, and organizing official records.</p></div><div class="welcomeicon" aria-label="Digital workspace">✦</div></section>
 <div class="stats"><div class="stat"><div class="label">Registered Programs / Projects</div><div class="value">${db.projects.length}</div><div class="hint">Across the project workspace</div></div><div class="stat"><div class="label">Projects In Progress</div><div class="value">${active}</div><div class="hint">Current implementation status</div></div><div class="stat"><div class="label">Documents in Workflow</div><div class="value">${pending}</div><div class="hint">Not yet closed or completed</div></div><div class="stat"><div class="label">Average Project Progress</div><div class="value">${avg}%</div><div class="hint">Based on entered progress values</div></div></div>
 <div class="twocol"><div class="panel"><div class="panelhead"><div><h3>Project implementation overview</h3><p>Progress values are manually updated by authorized users.</p></div><button class="secondary" data-go="projects">View all</button></div>${db.projects.length?db.projects.slice(0,5).map(p=>`<div style="margin:18px 0"><div style="display:flex;justify-content:space-between;gap:12px"><strong style="font-size:12px">${esc(p.name)}</strong>${statusPill(p.status)}</div><div class="bar"><span style="width:${Math.max(0,Math.min(100,Number(p.progress)||0))}%"></span></div><div style="font-size:11px;color:var(--muted)">${Number(p.progress)||0}% complete • Lead: ${esc(p.owner||'Not assigned')}</div></div>`).join(''):'<div class="empty">No projects yet. Add a project to begin.</div>'}</div>
 <div class="panel"><div class="panelhead"><div><h3>Quick actions</h3><p>Start a common workflow.</p></div></div><div class="quickgrid"><div class="quick"><span>◫</span><strong>Register a project</strong><p>Create a project record, timeline and lead.</p><button data-action="add-project">Add project</button></div><div class="quick"><span>▣</span><strong>Track a document</strong><p>Register incoming or outgoing documents.</p>${canEditTracing()?`<button data-action="add-doc">Add document</button>`:''}</div><div class="quick"><span>◷</span><strong>Record performance</strong><p>Update indicator targets and actual results.</p>${canEditMonitoring()?`<button data-action="add-indicator">Add indicator</button>`:''}</div><div class="quick"><span>▤</span><strong>Generate report</strong><p>Prepare a live summary from saved records.</p><button data-go="reports" class="secondary">Open reports</button></div></div></div></div>
 <div class="panel" style="margin-top:18px"><div class="panelhead"><div><h3>Upcoming school activities</h3><p>Shared events and program announcements.</p></div><button class="secondary" data-go="activities">View calendar</button></div>${db.activities.filter(a=>a.date>=today()&&a.status!=='Cancelled').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(a=>`<div class="eventcard"><div class="datebox"><b>${new Date(a.date+'T12:00:00').getDate()}</b><small>${new Date(a.date+'T12:00:00').toLocaleString('en',{month:'short'})}</small></div><div class="eventbody"><h4>${esc(a.title)}</h4><p>${esc(a.time||'Time TBA')} • ${esc(a.venue||'Venue TBA')}</p>${statusPill(a.status)}</div></div>`).join('')||'<div class="empty">No upcoming activities have been scheduled.</div>'}</div>
 <div class="panel" style="margin-top:18px"><div class="panelhead"><div><h3>Recent activity</h3><p>Latest actions recorded in this browser.</p></div></div>${db.activity.length?`<div class="timeline">${db.activity.slice(0,5).map(a=>`<div class="timelineitem"><span class="dot"></span><div><strong>${esc(a.msg)}</strong><p>${esc(a.date)}</p></div></div>`).join('')}</div>`:'<div class="empty">No activity yet. Your actions will appear here.</div>'}</div>`
}
function projectsPage(){let canManage=['Administrator','School Administrator','Project Coordinator'].includes(currentUser.role);return `<h3 class="sectiontitle">Projects &amp; Programs</h3><p class="sectiondesc">Register school projects and programs, define objectives and timelines, assign leads, and monitor implementation progress. Use the New project button to add a program or project and Export CSV to download the list.</p><div class="panel" style="margin-bottom:14px"><div class="panelhead"><div><h3>Project and program workspace</h3><p>Register new initiatives, track their status and progress, and edit or remove existing entries.</p></div><span class="pill">${db.projects.length} registered</span></div><div class="stats"><div class="stat"><div class="label">Planned</div><div class="value">${db.projects.filter(p=>p.status==='Planned').length}</div></div><div class="stat"><div class="label">In progress</div><div class="value">${db.projects.filter(p=>p.status==='In Progress').length}</div></div><div class="stat"><div class="label">Completed</div><div class="value">${db.projects.filter(p=>p.status==='Completed').length}</div></div></div></div><div class="toolbar"><input id="search" placeholder="Search projects or programs…" value="${esc(query)}"><select id="statusFilter"><option>All</option>${['Planned','In Progress','On Hold','Completed','Cancelled'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select>${canManage?'<button data-action="add-project">+ New project / program</button>':''}<button class="secondary" data-action="export-projects">Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>Project</th><th>Lead / Owner</th><th>Timeline</th><th>Status</th><th>Progress</th>${canManage?'<th>Actions</th>':''}</tr></thead><tbody>${db.projects.filter(p=>(filter==='All'||p.status===filter)&&JSON.stringify(p).toLowerCase().includes(query.toLowerCase())).map(p=>`<tr><td><strong>${esc(p.name)}</strong><span class="sub">${esc(p.id)} • ${String(p.id).startsWith('CLOUD-')?'Shared Supabase project':'Local sample / browser record'} • ${esc(p.objective||'No objective entered')}</span></td><td>${esc(p.owner||'—')}</td><td>${esc(p.start||'—')}<span class="sub">to ${esc(p.end||'—')}</span></td><td>${statusPill(p.status)}</td><td><strong>${Number(p.progress)||0}%</strong><div class="bar"><span style="width:${Math.max(0,Math.min(100,Number(p.progress)||0))}%"></span></div></td>${canManage?`<td><div class="actions"><button class="secondary" data-edit-project="${p.id}">Edit</button><button class="danger" data-delete-project="${p.id}">Delete</button></div></td>`:''}</tr>`).join('')||`<tr><td colspan="${canManage?6:5}" class="empty">No matching projects.</td></tr>`}</tbody></table></div>`}
function monitorPage(){return `<h3 class="sectiontitle">Monitoring & Evaluation</h3><p class="sectiondesc">Track performance indicators against targets and actual results. These records can inform periodic evaluation and accomplishment reporting.</p><div class="toolbar"><input id="search" placeholder="Search indicators…" value="${esc(query)}">${canEditMonitoring()?`<button data-action="add-indicator">+ Add indicator</button>`:''}<button class="secondary" data-action="export-indicators">Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>Indicator</th><th>Linked project</th><th>Target</th><th>Actual</th><th>Achievement</th><th>Last updated</th><th>Actions</th></tr></thead><tbody>${db.indicators.filter(i=>JSON.stringify(i).toLowerCase().includes(query.toLowerCase())).map(i=>{let pct=Number(i.target)>0?Math.round(Number(i.actual)/Number(i.target)*100):0;return `<tr><td><strong>${esc(i.name)}</strong><span class="sub">${esc(i.id)} • ${esc(i.unit||'unit not set')}</span></td><td>${esc(projectName(i.project))}</td><td>${esc(i.target)}</td><td>${esc(i.actual)}</td><td><strong>${pct}%</strong><div class="bar"><span style="width:${Math.min(100,Math.max(0,pct))}%"></span></div></td><td>${esc(i.date||'—')}</td><td><div class="actions">${canEditMonitoring()?`<button class="secondary" data-edit-indicator="${i.id}">Edit</button><button class="danger" data-delete-indicator="${i.id}">Delete</button>`:'<span class="sub">View only</span>'}</div></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No indicators recorded.</td></tr>'}</tbody></table></div>`}
function documentsPage(){return `<h3 class="sectiontitle">Document Tracing & Management</h3><p class="sectiondesc">Register documents, route them to the next responsible office or person, and maintain a traceable status history.</p><div class="toolbar"><input id="search" placeholder="Search title, ID, person or remarks…" value="${esc(query)}"><select id="statusFilter"><option>All</option>${['Received','For Review','Routed','Pending Action','Approved','Released','Returned','Completed','Closed'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select>${canEditTracing()?`<button data-action="add-doc">+ Register document</button>`:''}<button class="secondary" data-action="export-docs">Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>Document</th><th>From → To</th><th>Received / Due</th><th>Status</th><th>Current location</th><th>Actions</th></tr></thead><tbody>${db.docs.filter(d=>(filter==='All'||d.status===filter)&&JSON.stringify(d).toLowerCase().includes(query.toLowerCase())).map(d=>`<tr><td><strong>${esc(d.title)}</strong><span class="sub">${esc(d.id)} • ${esc(d.type)}</span><span class="sub">Priority: ${esc(d.priority||'Normal')}</span></td><td>${esc(d.from||'—')}<span class="sub">→ ${esc(d.to||'—')}</span></td><td>${esc(d.date||'—')}<span class="sub">Due: ${esc(d.due||'Not set')}</span></td><td>${statusPill(d.status)}</td><td>${esc(d.location||'—')}<span class="sub">${esc(d.remarks||'')}</span></td><td><div class="actions">${canEditTracing()?`<button data-route-doc="${d.id}">Update / Route</button><button class="secondary" data-edit-doc="${d.id}">Edit</button>`:'<span class="sub">View only</span>'}${currentUser.role==='Administrator'?`<button class="danger" data-delete-doc="${esc(d.id)}">Delete</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No matching documents.</td></tr>'}</tbody></table></div>`}
function recordsPage(){return `<h3 class="sectiontitle">Records & Retrieval</h3><p class="sectiondesc">Search and retrieve document metadata from the registered records. Add file reference details and follow your office's official records-retention and access policies.</p><div class="toolbar"><input id="search" placeholder="Search all registered records…" value="${esc(query)}"><button class="secondary" data-action="export-docs">Export records CSV</button></div><div class="stats"><div class="stat"><div class="label">Total records</div><div class="value">${db.docs.length}</div></div><div class="stat"><div class="label">High priority</div><div class="value">${db.docs.filter(d=>d.priority==='High').length}</div></div><div class="stat"><div class="label">Approved / Released</div><div class="value">${db.docs.filter(d=>/approved|released|completed|closed/i.test(d.status)).length}</div></div><div class="stat"><div class="label">Returned</div><div class="value">${db.docs.filter(d=>d.status==='Returned').length}</div></div></div><div class="tablewrap"><table><thead><tr><th>Record ID</th><th>Document title</th><th>Type</th><th>Status</th><th>Location</th><th>Record details</th></tr></thead><tbody>${db.docs.filter(d=>JSON.stringify(d).toLowerCase().includes(query.toLowerCase())).map(d=>`<tr><td><strong>${esc(d.id)}</strong></td><td>${esc(d.title)}</td><td>${esc(d.type)}</td><td>${statusPill(d.status)}</td><td>${esc(d.location||'—')}</td><td><div class="actions">${canEditTracing()?`<button class="secondary" data-edit-doc="${d.id}">View / edit</button>`:'<span class="sub">View only</span>'}${currentUser.role==='Administrator'?`<button class="danger" data-delete-doc="${esc(d.id)}">Delete</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No records match your search.</td></tr>'}</tbody></table></div>`}
function reportsPage(){let completed=db.projects.filter(p=>p.status==='Completed').length, avg=db.projects.length?Math.round(db.projects.reduce((s,p)=>s+Number(p.progress||0),0)/db.projects.length):0, approved=db.docs.filter(d=>/approved|released|completed|closed/i.test(d.status)).length;return `<h3 class="sectiontitle">Reports & Accomplishments</h3><p class="sectiondesc">Generate a current summary of project implementation, performance indicators, and document transactions. Review and validate the information before official submission.</p><div class="toolbar"><button data-action="generate-report">Generate current summary</button><button class="secondary" data-action="download-report">Download report (.txt)</button><button class="secondary" data-action="export-all">Export all data (JSON)</button></div><div class="stats"><div class="stat"><div class="label">Projects</div><div class="value">${db.projects.length}</div><div class="hint">${completed} marked completed</div></div><div class="stat"><div class="label">Average progress</div><div class="value">${avg}%</div><div class="hint">Entered project progress</div></div><div class="stat"><div class="label">Performance indicators</div><div class="value">${db.indicators.length}</div><div class="hint">Targets and actuals recorded</div></div><div class="stat"><div class="label">Documents completed</div><div class="value">${approved}</div><div class="hint">Approved, released, closed or completed</div></div></div><div class="panel"><div class="panelhead"><div><h3>Generated report preview</h3><p>Summary is generated from the current records in this browser.</p></div></div><div id="reportPreview" class="reportbox">Select “Generate current summary” to build the latest report.</div></div>`}
function settingsPage(){return `<h3 class="sectiontitle">Settings & Data Management</h3><p class="sectiondesc">Manage browser-stored workspace records and backups. Supabase account records are managed separately.</p><div class="panel"><div class="panelhead"><div><h3>Data backup and restore</h3><p>Export a JSON backup before resetting or moving browser data.</p></div></div><div class="toolbar"><button data-action="export-all">Download backup (JSON)</button><label class="secondary" style="display:inline-flex;align-items:center;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:650">Import backup <input type="file" id="importFile" accept=".json,application/json" style="display:none"></label><button class="danger" data-action="reset-data">Reset browser records</button><button class="danger" data-action="delete-local-data">Delete Local Data</button></div></div>`}

const ENEXUS_OTHER_POSITIONS=ENEXUS_POSITIONS.filter(p=>['Parent / Guardian','SPTA President','SPTA Vice President','SPTA Secretary','SPTA Treasurer','SPTA Officer','Partner / Stakeholder','Other'].includes(p));
function updateRegistrationPositionOptions(){
 const form=document.getElementById('authForm');if(!form)return;
 const type=form.elements.account_type?.value;
 const select=form.elements.position;
 const other=form.elements.other_position;
 if(!select)return;
 const options=!type?ENEXUS_POSITIONS:type==='School Personnel'?ENEXUS_SCHOOL_PERSONNEL_POSITIONS:type==='Parents/Guardian'?['Parent / Guardian','Other']:type==='SPTA / Officers Only'?['SPTA President','SPTA Vice President','SPTA Secretary','SPTA Treasurer','SPTA Officer','Other']:type==='Other Partners/Stakeholders'?['Partner / Stakeholder','Other']:[];
 const previous=select.value;
 select.innerHTML='<option value="">Select your position</option>'+options.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
 if(options.includes(previous))select.value=previous;
 select.disabled=false;
 if(other){other.closest('.formgroup').style.display=select.value==='Other'?'':'none';other.required=select.value==='Other';}
 const hint=document.getElementById('coordinatorRegistrationHint');
 if(hint)hint.style.display=type==='School Personnel'&&['ICT Coordinator','Program Coordinator'].includes(select.value)?'block':'none';
}

  <h2>${isRegister?'Request an account':'Sign in'}</h2>
  <p>${isRegister?'Create an account request. An administrator must approve access before you can use the workspace.':'Sign in with your registered email and password.'}</p>
  <div id="authMessage" class="notice" style="${message?'':'display:none'}">${esc(message)}</div>
  <form id="authForm">
   ${isRegister?`<div class="formgroup"><label>Full name</label><input name="full_name" autocomplete="name" required maxlength="120"></div>
   <div class="formgroup"><label>School *</label><select name="school_name" required><option value="">Select your school</option>${ENEXUS_SCHOOLS.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div>
   <div class="formgroup"><label>Account type *</label><select name="account_type" required><option value="">Select account type</option>${['School Personnel','Parents/Guardian','Other Partners/Stakeholders','SPTA / Officers Only'].map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select></div>
   <div class="formgroup"><label>Position in school / organization *</label><select name="position" required><option value="">Select your position</option>${ENEXUS_POSITIONS.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select></div>
   <div class="formgroup" style="display:none"><label>Other position *</label><input name="other_position" maxlength="120" placeholder="Specify if Other"></div><div id="coordinatorRegistrationHint" class="notice" style="display:none">Only one approved ICT Coordinator and one approved Program Coordinator are permitted per school. You may submit a request, but approval depends on whether the position is available at your school.</div>`:''}
   <div class="formgroup"><label>Email address</label><input name="email" type="email" autocomplete="email" required maxlength="254"></div>
   <div class="formgroup"><label>Password</label><input name="password" type="password" autocomplete="${isRegister?'new-password':'current-password'}" minlength="8" required></div>
   <button id="authSubmit" type="submit" style="width:100%;margin-top:5px">${isRegister?'Submit registration request':'Sign in'}</button>
  </form>
  <p style="margin:16px 0 0;text-align:center">${isRegister?'Already registered?':'Need an account?'} <a href="#" id="authSwitch">${isRegister?'Sign in':'Request registration'}</a></p>
  <div class="demoaccount">Access is granted only after an administrator approves your account. Do not use this site for confidential records until the database and access policies are configured.</div>
 </div>`;
 $('#authSwitch').onclick=e=>{e.preventDefault();showLogin(isRegister?'login':'register')};
 const closeAuth=document.getElementById('authClose');
 if(closeAuth){closeAuth.style.display='';closeAuth.onclick=()=>{if(isRegister){showLogin('login');}else{showPublicLanding();}};}
 if(isRegister){
  const form=document.getElementById('authForm');
  form.elements.account_type.addEventListener('change',updateRegistrationPositionOptions);
  form.elements.position.addEventListener('change',()=>{const other=form.elements.other_position;const position=form.elements.position.value;if(other){other.closest('.formgroup').style.display=position==='Other'?'':'none';other.required=position==='Other';}const hint=document.getElementById('coordinatorRegistrationHint');if(hint)hint.style.display=form.elements.account_type.value==='School Personnel'&&['ICT Coordinator','Program Coordinator'].includes(position)?'block':'none';});
  updateRegistrationPositionOptions();
 }
 $('#authForm').onsubmit=async e=>{
   e.preventDefault();
   if(!authClient){authMessage('Authentication is not configured yet. Add your Supabase project URL and publishable key in the code.');return;}
   if(authBusy)return;
   const data=Object.fromEntries(new FormData(e.target));const email=data.email.trim().toLowerCase();
   let selectedPosition='';
   if(isRegister){
    selectedPosition=data.position==='Other'?(data.other_position||'').trim():(data.position||'').trim();
    if(!data.account_type||!selectedPosition){authMessage('Select your account type and position before submitting.');return;}
   }
   authBusy=true;const submit=$('#authSubmit');submit.disabled=true;submit.textContent='Please wait…';
   try{
    if(isRegister){
      const {data:result,error}=await authClient.auth.signUp({email,password:data.password,options:{emailRedirectTo:'https://aliagadistrict.github.io/https-project-e-nexus.netlify.app-/',data:{full_name:data.full_name.trim(),school_name:data.school_name,account_type:data.account_type,agency:selectedPosition,position_in_school:data.account_type==='School Personnel'?selectedPosition:null}}});
      if(error)throw error;
      if(result.session){await loadAuthenticatedUser(result.session.user);}
      else showLogin('login','Registration submitted. Check your email if confirmation is enabled. Your account must be approved by an administrator before access is granted. Coordinator requests are subject to one approved account per position per school.');
    }else{
      const {data:result,error}=await authClient.auth.signInWithPassword({email,password:data.password});
      if(error)throw error;
      await loadAuthenticatedUser(result.user);
    }
   }catch(err){authMessage(err.message||'Authentication failed. Please try again.');}
   finally{authBusy=false;const b=$('#authSubmit');if(b){b.disabled=false;b.textContent=isRegister?'Submit registration request':'Sign in';}}
 };
 if(message)authMessage(message);
}
async function loadAuthenticatedUser(authUser){
 if(!authClient||!authUser){currentUser=null;showLogin();return;}
 const {data:profile,error}=await authClient.from('profiles').select('full_name,agency,role,approved,school_name,account_status,position_in_school').eq('id',authUser.id).maybeSingle();
 if(error){currentUser=null;showLogin('login','Could not verify your access profile. Ask the administrator to check the Supabase profiles table and Row Level Security settings.');return;}
 if(!profile||!profile.approved||profile.account_status!=='Approved'){
   currentUser=null;
   await authClient.auth.signOut();
   showLogin('login','Your account is registered but is awaiting administrator approval. You cannot access the workspace yet.');
   return;
 }
 currentUser={id:authUser.id,email:authUser.email,name:profile.full_name||authUser.email,role:profile.role||'Partner Agency',agency:profile.agency||'',school_name:profile.school_name||'',position_in_school:profile.position_in_school||''};
 if(document.getElementById('authOverlay'))document.getElementById('authOverlay').remove();
 page=isSystemAdmin()?'dashboard':isICTCoordinator()?'monitoring':'projects';render();
}
function showPasswordRecovery(){
 let overlay=document.getElementById('authOverlay');

async function loadUsersDirectory(){
 const host=$('#realUsersDirectory');if(!host||!authClient||currentUser?.role!=='Administrator')return;
 const {data:users,error}=await authClient.from('profiles').select('id,email,full_name,agency,role,approved,account_status,access_revoked,created_at').order('created_at',{ascending:true});
 if(page!=='users')return;

 if(!users||!users.length){host.innerHTML='<div class="empty">No registered accounts found yet.</div>';return;}
 // Email addresses for legacy Phase 4 registrations remain locked in auth.users.

 const {data:emailRows,error:emailError}=await authClient.rpc('enexus_admin_user_emails');
 if(page!=='users')return;
 const emailById=new Map((emailRows||[]).map(row=>[row.user_id,row.email]));
 users.forEach(u=>{u.email=emailById.get(u.id)||u.email||'';});
 const emailNotice=emailError?`<div class="notice">Account emails could not be retrieved from Authentication. Some older profiles may have blank emails. Details: ${esc(emailError.message)}</div>`:'';
 const roles=['Administrator','School Administrator','Project Coordinator','School Personnel','Records Officer','Partner Agency'];
 const {data:districtAdminAllowed,error:districtAdminError}=await authClient.rpc('enexus_is_district_admin');
 const canManageAccess=!districtAdminError&&districtAdminAllowed===true;
 host.innerHTML=`${emailNotice}<div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Organization</th><th>Role</th><th>Account status</th><th>Actions</th></tr></thead><tbody>${users.map(u=>`<tr><td><strong>${esc(u.full_name||'Name not provided')}</strong><span class="sub">${esc((u.id||'').slice(0,8))}…</span></td><td>${esc(u.email||'Email unavailable')}</td><td>${esc(u.agency||'—')}</td><td><select data-user-role="${esc(u.id)}">${roles.map(r=>`<option value="${esc(r)}" ${u.role===r?'selected':''}>${esc(r)}</option>`).join('')}</select></td><td>${u.access_revoked===true?'<span class="pill red">Access revoked</span>':u.approved?'<span class="pill green">Approved / Active</span>':'<span class="pill amber">Pending approval</span>'}</td><td><div class="actions"><button data-save-user="${esc(u.id)}">Save role</button><button class="secondary" data-toggle-user="${esc(u.id)}" data-approved="${u.approved?'true':'false'}" data-revoked="${u.access_revoked===true?'true':'false'}" ${u.role==='Administrator'||u.id===currentUser.id?'disabled title="Administrator account protected"':u.approved&&!canManageAccess?'disabled title="District Administrator authorization required"':''}>${u.role==='Administrator'||u.id===currentUser.id?'Protected Administrator':!u.approved?'Approve account':u.access_revoked===true?'Restore access':'Revoke access'}</button><button type="button" class="secondary" data-reset-user="${esc(u.id)}">Reset password</button><button type="button" data-delete-user="${esc(u.id)}" style="background:#b42318;color:white;border-color:#b42318" ${u.role==='Administrator'||u.id===currentUser.id?'disabled title="Administrator accounts are protected from deletion"':''}>${u.role==='Administrator'||u.id===currentUser.id?'Protected Administrator':'Delete User'}</button></div></td></tr>`).join('')}</tbody></table></div>`;
 host.querySelectorAll('[data-reset-user]').forEach(btn=>btn.onclick=async()=>{
   if(currentUser?.role!=='Administrator')return toast('Administrator access required.');
   const u=users.find(x=>x.id===btn.dataset.resetUser);
   if(!u?.email)return toast('This account has no email address.');
   if(!confirm('Send a password-reset email to '+u.email+'? The account holder will set their own new password.'))return;
   btn.disabled=true;
   const {error}=await authClient.auth.resetPasswordForEmail(u.email,{redirectTo:'https://aliagadistrict.github.io/https-project-e-nexus.netlify.app-/'});
   btn.disabled=false;
   if(error)return toast('Reset request failed: '+error.message);

 });
 host.querySelectorAll('[data-save-user]').forEach(btn=>btn.onclick=async()=>{const id=btn.dataset.saveUser;const select=host.querySelector(`[data-user-role="${id}"]`);const role=select?.value;if(!role)return;btn.disabled=true;btn.disabled=false;toast('Role changes are locked for security. Use an authorized administrator role-assignment workflow.');loadUsersDirectory();});
 host.querySelectorAll('[data-toggle-user]').forEach(btn=>btn.onclick=async()=>{
   const id=btn.dataset.toggleUser;

   if(!user)return;
   if(!user.approved){
     btn.disabled=true;
     const {error}=await authClient.rpc('enexus_approve_account',{target_user_id:id});
     btn.disabled=false;
     if(error){toast('Approval failed: '+error.message);return;}
     toast('Account approved.');await loadUsersDirectory();return;
   }
   if(!canManageAccess){toast('District Administrator authorization required.');return;}
   if(id===currentUser.id||user.role==='Administrator'){
     toast('Administrator accounts cannot be revoked or restored.');return;
   }
   const action=user.access_revoked===true?'restore':'revoke';
   const label=user.email||user.full_name||id;
   const question=action==='revoke'
     ?'Revoke login and database access for '+label+'? This may interrupt their work.'

   if(!window.confirm(question))return;
   btn.disabled=true;
   btn.textContent=action==='revoke'?'Revoking…':'Restoring…';
   try{
     const {data,error}=await authClient.functions.invoke('enexus-manage-user-access',{
       body:{target_user_id:id,action}
     });
     if(error){
       let detail=error.message||'Request failed';
       const response=error.context;
       if(response instanceof Response){
         try{const body=await response.clone().json();detail=body?.error||detail;
           if(body?.manual_review_required)detail+=' — manual administrator review required';
         }catch(_){}
       }
       throw new Error(detail);
     }
     if(!data?.success)throw new Error(data?.error||'Server did not confirm the change.');
     toast(action==='revoke'?'Access revoked successfully.':'Access restored successfully.');
   }catch(err){
     toast('Access change failed: '+(err?.message||'Unknown error')+'; check Supabase before retrying.');
   }finally{
     await loadUsersDirectory();
   }
 });
 async function confirmEnexusUserDeletion(label){
   // A single Delete/Cancel dialog, with no typed confirmation.
   if(typeof HTMLDialogElement==='undefined'){
     return window.confirm('Permanently delete '+label+'? This cannot be undone.');
   }
   return new Promise(resolve=>{
     const dialog=document.createElement('dialog');
     dialog.setAttribute('aria-label','Confirm user deletion');
     dialog.style.cssText='border:1px solid #dbe3ec;border-radius:14px;padding:24px;max-width:min(440px,calc(100vw - 32px));width:100%;box-shadow:0 20px 70px #10263e44;color:#1c2b3a;font-family:inherit';
     const heading=document.createElement('h3');heading.textContent='Delete user account?';heading.style.margin='0 0 12px';
     const message=document.createElement('p');message.textContent='Permanently delete '+label+'? This removes their login access and may affect related records. This action cannot be undone.';message.style.cssText='line-height:1.5;font-size:14px;margin:0 0 22px';
     const actions=document.createElement('div');actions.style.cssText='display:flex;justify-content:flex-end;gap:10px';
     const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Cancel';cancel.className='secondary';
     const remove=document.createElement('button');remove.type='button';remove.textContent='Delete';remove.className='danger';
     actions.append(cancel,remove);dialog.append(heading,message,actions);document.body.appendChild(dialog);
     let settled=false;
     const finish=value=>{if(settled)return;settled=true;dialog.close();dialog.remove();resolve(value);};
     cancel.addEventListener('click',()=>finish(false));
     remove.addEventListener('click',()=>finish(true));
     dialog.addEventListener('cancel',event=>{event.preventDefault();finish(false);});
     dialog.addEventListener('close',()=>finish(false));
     dialog.showModal();
     cancel.focus();
   });
 }
 host.querySelectorAll('[data-delete-user]').forEach(btn=>btn.onclick=async()=>{
   const id=btn.dataset.deleteUser;
   if(currentUser?.role!=='Administrator'){toast('Administrator access required.');return;}
   if(id===currentUser.id){toast('You cannot delete your own administrator account.');return;}
   const user=users.find(u=>u.id===id);
   if(!user)return;
   if(user.role==='Administrator'){toast('Administrator accounts are protected from deletion.');return;}
   const label=user.email||user.full_name||id;
   if(!await confirmEnexusUserDeletion(label))return;
   btn.disabled=true;btn.textContent='Deleting…';
   try{
     const {data,error}=await authClient.functions.invoke('enexus-delete-user',{body:{user_id:id}});
     if(error)throw error;
     if(!data?.success)throw new Error(data?.error||'Deletion was not confirmed by the server.');
     toast('User account permanently deleted.');
     await loadUsersDirectory();
   }catch(err){
     let detail=err?.message||'Unknown error';
     const response=err?.context;
     if(response instanceof Response){
       try{
         const body=await response.clone().text();
         if(body){
           let parsed;
           try{parsed=JSON.parse(body);}catch(_){parsed=null;}
           detail+=' (HTTP '+response.status+': '+(parsed?.error||parsed?.message||body.slice(0,250))+')';
         }else detail+=' (HTTP '+response.status+')';
       }catch(_){detail+=' (HTTP '+response.status+')';}
     }
     toast('Could not delete user: '+detail);
     btn.disabled=false;btn.textContent='Delete User';
   }
 });
}

async function loadSharedProjects(force=false){
 if(!authClient||!currentUser||sharedProjectLoading)return;
 if(!force&&Date.now()-(window._lastProjectLoad||0)<12000)return;
 sharedProjectLoading=true;
 try{
  const {data,error}=await authClient.from('enexus_linked_projects').select('*').order('created_at',{ascending:false}).limit(300);
  if(error){console.warn('Linked projects:',error.message);return;}
  const items=(data||[]).filter(p=>!isICTCoordinator()||(p.school_name&&p.school_name===currentUser.school_name)).map(p=>({...p,id:'CLOUD-'+p.id}));
  db.projects=[...db.projects.filter(p=>!String(p.id).startsWith('CLOUD-')),...items];
  db.docs=[...db.docs.filter(d=>!String(d.id).startsWith('LINK-')),...items.map(p=>({id:'LINK-'+p.id,title:'Project record: '+p.name,type:'Project Plan',from:p.owner||'Project Coordinator',to:'Document Tracing',date:p.start||'',due:p.end||'',status:p.status,priority:'Normal',location:'Linked project registry',remarks:'Automatically linked to '+p.id,school_name:p.school_name}))];

  window._lastProjectLoad=Date.now();
  if(['projects','monitoring','documents','dashboard','reports','records'].includes(page))render();
 }finally{sharedProjectLoading=false;}
}

const {error}=await authClient.from('enexus_org_chart').delete().eq('id',b.dataset.chartDelete).eq('school_name',chartSelectedSchool());if(error)return toast(error.message);toast('Chart entry removed.');loadOrgChart()});}
function chartForm(r=null){if(!cloudCanEdit('orgchart'))return;const categories=chartCategories.map(c=>`<option value="${esc(c)}" ${r?.category===c?'selected':''}>${esc(c)}</option>`).join('');openModal(r?'Edit chart entry':'Add chart entry',`<form id="chartForm"><div class="formgrid">${field('Full name *','full_name',r?.full_name||'')}${field('Position *','position',r?.position||'')}<div class="formgroup"><label>Chart level *</label><select name="category">${categories}</select></div><div class="formgroup full"><label>Photograph (JPG, PNG or WebP, up to 2 MB)</label><input type="file" name="photo" accept="image/jpeg,image/png,image/webp"></div></div><div class="formactions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button type="submit">Save entry</button></div></form>`);$('#chartForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const full_name=String(fd.get('full_name')||'').trim(),position=String(fd.get('position')||'').trim(),category=String(fd.get('category'));if(!full_name||!position)return toast('Name and position are required.');const photo=fd.get('photo');let photo_path=r?.photo_path||null;if(photo&&photo.size){if(photo.size>2*1024*1024||!['image/jpeg','image/png','image/webp'].includes(photo.type))return toast('Use JPG, PNG, or WebP under 2 MB.');const extension=photo.type==='image/png'?'png':photo.type==='image/webp'?'webp':'jpg';const path=currentUser.id+'/'+crypto.randomUUID()+'.'+extension;const {error:uploadError}=await authClient.storage.from('enexus-personnel-photos').upload(path,photo,{contentType:photo.type,upsert:false});if(uploadError)return toast('Photo upload failed: '+uploadError.message);photo_path=path;}const school_name=chartSelectedSchool();if(!school_name)return toast('Select a valid school before saving.');if(r&&r.school_name!==school_name)return toast('School changed. Refresh the chart and try again.');const values={full_name,position,office:school_name,category,photo_path,school_name};const {error}=r?await authClient.from('enexus_org_chart').update(values).eq('id',r.id).eq('school_name',school_name):await authClient.from('enexus_org_chart').insert({...values,created_by:currentUser.id});if(error)return toast('Save failed: '+error.message);closeModal();toast('Organizational chart saved.');loadOrgChart();};}


// Project e-NEXUS: authenticated, school-scoped Supabase project attachments.
// All authorization decisions are enforced by Supabase RLS and RPC functions.
const ENEXUS_FILE_BUCKET='enexus-project-files';
const ENEXUS_FILE_TYPES=['application/pdf','image/jpeg','image/png'];
const ENEXUS_FILE_MAX=20*1024*1024;
let enexusFileProject='',enexusFileBusy=false,enexusFileRequest=0;
const enexusFileProjects=()=>db.projects.filter(p=>String(p.id).startsWith('CLOUD-')&&p.school_name);
const enexusFileCanManage=()=>['Administrator','School Administrator','Project Coordinator','ICT Coordinator Moderator'].includes(currentUser?.role);
function enexusFilePanel(){
 const projects=enexusFileProjects();
 if(!projects.length)return `<section class="panel" style="margin-top:20px"><h3>Project Attachments</h3><p class="sectiondesc">No shared Supabase projects are available to your account. Project attachments require a linked project.</p></section>`;
 if(!projects.some(p=>p.id===enexusFileProject))enexusFileProject=projects[0].id;
 return `<section class="panel" style="margin-top:20px" id="enexusAttachments"><div class="panelhead"><div><h3>Project Attachments</h3><p>Secure PDFs, receipts, certificates, accomplishment reports, and programs of work. Files are private and school-scoped.</p></div><button class="secondary" id="enexusFileRefresh" type="button">Refresh</button></div>
 <div class="formgroup" style="margin-bottom:14px"><label for="enexusFileProject">Select shared project</label><select id="enexusFileProject">${projects.map(p=>`<option value="${esc(p.id)}" ${p.id===enexusFileProject?'selected':''}>${esc(p.name)} — ${esc(p.school_name)}</option>`).join('')}</select></div>
 ${enexusFileCanManage()?`<form id="enexusFileUpload" class="panel" style="background:#f8fafc;margin-bottom:16px"><h4 style="margin:0 0 12px">Upload attachment</h4><div class="formgrid"><div class="formgroup"><label for="enexusFileCategory">Document category</label><select id="enexusFileCategory" required><option>Accomplishment Report</option><option>Certificate of Completion</option><option>Program of Work</option><option>Receipt</option><option>Other</option></select></div><div class="formgroup"><label for="enexusFileInput">Select PDF or image (maximum 20 MB)</label><input id="enexusFileInput" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" required></div></div><div class="formactions"><button type="submit" id="enexusFileUploadButton">Upload File</button></div><p style="font-size:11px;color:var(--muted);margin:8px 0 0">Upload is available only for projects and schools permitted by the database. Do not upload confidential files until your deployment has passed a full access review.</p></form>`:''}
 <div id="enexusFileList" aria-live="polite">Loading project attachments…</div>
 ${enexusFileCanManage()?`<div style="margin-top:20px"><div class="panelhead"><div><h3>Recycle Bin</h3><p>Restore deleted files within 30 days. Permanent storage cleanup requires a separate trusted server-side process.</p></div></div><div id="enexusRecycleList" aria-live="polite">Loading deleted files…</div></div>`:''}</section>`;
}
function enexusMountFiles(){
 const host=document.querySelector('#enexusAttachments');if(!host)return;
 document.querySelector('#enexusFileProject').onchange=e=>{enexusFileProject=e.target.value;enexusLoadFiles()};
 document.querySelector('#enexusFileRefresh').onclick=()=>enexusLoadFiles();
 const form=document.querySelector('#enexusFileUpload');if(form)form.onsubmit=enexusUploadFile;
 enexusLoadFiles();
}
async function enexusLoadFiles(){
 const project=enexusFileProjects().find(p=>p.id===enexusFileProject);
 const list=document.querySelector('#enexusFileList'),recycle=document.querySelector('#enexusRecycleList');
 if(!list||!project||!authClient||!currentUser)return;
 const request=++enexusFileRequest;
 list.textContent='Loading attachments…';if(recycle)recycle.textContent='Loading Recycle Bin…';
 const projectId=project.id.slice(6);
 const {data,error}=await authClient.from('enexus_project_files').select('id,project_id,school_name,category,original_filename,storage_path,content_type,uploaded_at').eq('project_id',projectId).eq('school_name',project.school_name).is('deleted_at',null).order('uploaded_at',{ascending:false});
 if(request!==enexusFileRequest||!document.querySelector('#enexusFileList'))return;
 if(error){list.textContent='Cannot load attachments: '+error.message;}
 else if(!data?.length){list.innerHTML='<div class="empty">No uploaded attachments for this project.</div>';}
 else{
 list.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Document</th><th>Category</th><th>Uploaded</th><th>Actions</th></tr></thead><tbody>${data.map(f=>`<tr><td><strong>${esc(f.original_filename)}</strong></td><td>${esc(f.category)}</td><td>${esc(new Date(f.uploaded_at).toLocaleString())}</td><td><div class="actions"><button class="secondary" type="button" data-enexus-download="${esc(f.id)}">Download</button>${enexusFileCanManage()?`<button class="danger" type="button" data-enexus-delete="${esc(f.id)}">Delete</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`;
 list.querySelectorAll('[data-enexus-download]').forEach(b=>b.onclick=()=>enexusDownloadFile(data.find(f=>f.id===b.dataset.enexusDownload)));
 list.querySelectorAll('[data-enexus-delete]').forEach(b=>b.onclick=()=>enexusDeleteFile(data.find(f=>f.id===b.dataset.enexusDelete)));
 }
 if(recycle){
 const result=await authClient.rpc('enexus_list_recycle_bin');
 if(request!==enexusFileRequest||!document.querySelector('#enexusRecycleList'))return;
 if(result.error){recycle.textContent='Cannot load Recycle Bin: '+result.error.message;return;}
 const rows=(result.data||[]).filter(f=>f.project_id===projectId&&f.school_name===project.school_name);
 if(!rows.length){recycle.innerHTML='<div class="empty">No deleted files for this project.</div>';return;}
 recycle.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Document</th><th>Deleted</th><th>Restore deadline</th><th>Actions</th></tr></thead><tbody>${rows.map(f=>`<tr><td><strong>${esc(f.original_filename)}</strong><span class="sub">${esc(f.deletion_reason||'No reason provided')}</span></td><td>${esc(new Date(f.deleted_at).toLocaleString())}</td><td>${esc(new Date(f.restore_deadline).toLocaleString())}</td><td>${new Date(f.restore_deadline)>new Date()?`<button class="secondary" type="button" data-enexus-restore="${esc(f.file_id)}">Restore</button>`:'<span class="pill">Expired</span>'}</td></tr>`).join('')}</tbody></table></div>`;
 recycle.querySelectorAll('[data-enexus-restore]').forEach(b=>b.onclick=()=>enexusRestoreFile(b.dataset.enexusRestore));
 }
}
async function enexusUploadFile(event){
 event.preventDefault();if(enexusFileBusy||!authClient||!currentUser)return;
 const project=enexusFileProjects().find(p=>p.id===enexusFileProject);
 const file=document.querySelector('#enexusFileInput')?.files?.[0];
 if(!project||!file)return toast('Select a shared project and a file.');
 const ext=file.name.split('.').pop().toLowerCase();
 const valid=(file.type==='application/pdf'&&ext==='pdf')||(file.type==='image/jpeg'&&['jpg','jpeg'].includes(ext))||(file.type==='image/png'&&ext==='png');
 if(!valid||!ENEXUS_FILE_TYPES.includes(file.type))return toast('Only PDF, JPEG, and PNG files are allowed.');
 if(file.size>ENEXUS_FILE_MAX||!file.size)return toast('File must be between 1 byte and 20 MB.');
 const path=project.school_name+'/'+project.id.slice(6)+'/'+crypto.randomUUID()+'.'+ext;
 const category=document.querySelector('#enexusFileCategory').value;
 enexusFileBusy=true;const button=document.querySelector('#enexusFileUploadButton');if(button){button.disabled=true;button.textContent='Uploading…';}
 try{
  const {error:uploadError}=await authClient.storage.from(ENEXUS_FILE_BUCKET).upload(path,file,{contentType:file.type,upsert:false});
  if(uploadError)throw uploadError;
  const {error:metadataError}=await authClient.from('enexus_project_files').insert({project_id:project.id.slice(6),school_name:project.school_name,category,original_filename:file.name,storage_path:path,content_type:file.type,uploaded_by:currentUser.id});
  if(metadataError)throw new Error('Storage upload succeeded but metadata registration failed: '+metadataError.message+'. Contact your administrator to reconcile the orphaned Storage object: '+path);
  toast('Attachment uploaded successfully.');const input=document.querySelector('#enexusFileInput');if(input)input.value='';await enexusLoadFiles();
 }catch(error){console.error('Project attachment upload:',error);alert('Upload failed: '+(error.message||String(error)));}
 finally{enexusFileBusy=false;const b=document.querySelector('#enexusFileUploadButton');if(b){b.disabled=false;b.textContent='Upload File';}}
}
async function enexusDownloadFile(file){
 if(!file||!authClient)return;
 const {data,error}=await authClient.storage.from(ENEXUS_FILE_BUCKET).download(file.storage_path);
 if(error)return alert('Download failed: '+error.message);
 download(file.original_filename,data,file.content_type||'application/octet-stream');
}
async function enexusDeleteFile(file){
 if(!file||!enexusFileCanManage())return;
 if(!confirm('Move "'+file.original_filename+'" to the Recycle Bin? You may restore it within 30 days.'))return;
 const reason=prompt('Reason for deletion (optional):','');if(reason===null)return;
 const {error}=await authClient.rpc('enexus_delete_project_file',{target_file_id:file.id,reason:reason||null});
 if(error)return alert('Delete failed: '+error.message);
 toast('File moved to Recycle Bin.');await enexusLoadFiles();
}
async function enexusRestoreFile(fileId){
 if(!enexusFileCanManage()||!confirm('Restore this file?'))return;
 const {error}=await authClient.rpc('enexus_restore_project_file',{target_file_id:fileId});
 if(error)return alert('Restore failed: '+error.message);
 toast('File restored.');await enexusLoadFiles();
}
// Extend the existing page without changing its other project-management features.
const enexusOriginalProjectsPage=projectsPage;
projectsPage=function(){return enexusOriginalProjectsPage()+enexusFilePanel();};
const enexusOriginalRender=render;
render=function(){enexusOriginalRender();if(page==='projects'&&currentUser)enexusMountFiles();};


// District File Management — Supabase-backed, RLS-enforced.
let districtFileSchool='ALL',districtFileCategory='ALL',districtFileSearch='',districtFileRequest=0;
function districtFilesPanel(){
 const admin=isSystemAdmin();
 const school=admin?districtFileSchool:(currentUser?.school_name||'');
 const schoolOptions=admin?`<option value="ALL">All 23 Schools</option>${ENEXUS_SCHOOLS.map(n=>`<option value="${esc(n)}" ${school===n?'selected':''}>${esc(n)}</option>`).join('')}`:`<option value="${esc(school)}">${esc(school)}</option>`;
 const projects=enexusFileProjects().filter(p=>admin&&(school==='ALL'||p.school_name===school)||!admin&&p.school_name===school);
 return `<section class="panel" id="districtFileManager" style="margin-top:22px"><div class="panelhead"><div><h3>District File Management</h3><p>Secure project files and attachments from Supabase. Access is enforced by database policies.</p></div><button class="secondary" type="button" id="districtFileRefresh">Refresh</button></div>
 <div class="formgrid" style="margin-bottom:16px"><div class="formgroup"><label for="districtFileSchool">School</label><select id="districtFileSchool" ${admin?'':'disabled'}>${schoolOptions}</select></div><div class="formgroup"><label for="districtFileCategory">File category</label><select id="districtFileCategory"><option value="ALL">All categories</option>${['Accomplishment Report','Certificate of Completion','Program of Work','Receipt','Other'].map(x=>`<option ${districtFileCategory===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="formgroup full"><label for="districtFileSearch">Search file name, school or project</label><input id="districtFileSearch" placeholder="Search attachments…" value="${esc(districtFileSearch)}"></div></div>
 <div id="districtFileResults" aria-live="polite">Loading files…</div>
 ${enexusFileCanManage()?`<form id="districtFileUpload" class="panel" style="margin-top:18px;background:#f8fafc"><h4 style="margin:0 0 12px">Upload project attachment</h4><div class="formgrid"><div class="formgroup"><label for="districtUploadProject">Linked project (required)</label><select id="districtUploadProject" required><option value="">Choose a project</option>${projects.map(p=>`<option value="${esc(p.id)}">${esc(p.school_name)} — ${esc(p.name)}</option>`).join('')}</select></div><div class="formgroup"><label for="districtUploadCategory">Category</label><select id="districtUploadCategory"><option>Accomplishment Report</option><option>Certificate of Completion</option><option>Program of Work</option><option>Receipt</option><option>Other</option></select></div><div class="formgroup full"><label for="districtUploadInput">PDF, JPG or PNG (20 MB maximum)</label><input id="districtUploadInput" type="file" accept=".pdf,.jpg,.jpeg,.png" required></div></div><div class="formactions"><button id="districtUploadButton" type="submit" ${projects.length?'':'disabled'}>Upload attachment</button></div><p class="sectiondesc" style="margin:6px 0 0">Uploads require a linked Supabase project and permission to manage that school. Do not upload confidential records before a full access review.</p></form>`:''}</section>`;
}
const districtOriginalRecordsPage=recordsPage;
recordsPage=function(){return districtOriginalRecordsPage()+districtFilesPanel();};
const districtOriginalIctRecordsPage=ictRecordsPage;
ictRecordsPage=function(){return districtOriginalIctRecordsPage()+districtFilesPanel();};
function districtMountFiles(){
 const host=document.getElementById('districtFileManager');if(!host)return;
 const school=document.getElementById('districtFileSchool');school.onchange=()=>{districtFileSchool=school.value;render();};
 document.getElementById('districtFileCategory').onchange=e=>{districtFileCategory=e.target.value;districtLoadFiles();};
 document.getElementById('districtFileSearch').oninput=e=>{districtFileSearch=e.target.value;districtLoadFiles();};
 document.getElementById('districtFileRefresh').onclick=districtLoadFiles;
 const form=document.getElementById('districtFileUpload');if(form)form.onsubmit=districtUploadFile;
 districtLoadFiles();
}
async function districtLoadFiles(){
 const host=document.getElementById('districtFileResults');if(!host)return;
 const request=++districtFileRequest;
 if(!authClient||!currentUser){host.textContent='Sign in to view files.';return;}
 host.textContent='Loading district attachments…';
 const admin=isSystemAdmin(),school=admin?districtFileSchool:currentUser.school_name;
 let q=authClient.from('enexus_project_files').select('id,project_id,school_name,category,original_filename,storage_path,content_type,uploaded_at').is('deleted_at',null).order('uploaded_at',{ascending:false}).limit(1000);
 if(school&&school!=='ALL')q=q.eq('school_name',school);
 if(districtFileCategory!=='ALL')q=q.eq('category',districtFileCategory);
 const {data,error}=await q;
 if(request!==districtFileRequest||!document.getElementById('districtFileResults'))return;
 if(error){host.textContent='Cannot load files: '+error.message;return;}
 const term=districtFileSearch.trim().toLowerCase();
 const rows=(data||[]).filter(f=>!term||[f.original_filename,f.school_name,f.category,enexusFileProjects().find(p=>p.id==='CLOUD-'+f.project_id)?.name||''].some(x=>String(x||'').toLowerCase().includes(term)));
 if(!rows.length){host.innerHTML='<div class="empty">No registered attachments match these filters. Upload a file under a linked project to begin.</div>';return;}
 host.innerHTML=`<p class="sectiondesc">Showing ${rows.length} file(s)${data.length===1000?' (first 1,000 records)':''}.</p><div class="tablewrap"><table><thead><tr><th>File</th><th>School</th><th>Project</th><th>Category</th><th>Uploaded</th><th>Actions</th></tr></thead><tbody>${rows.map(f=>`<tr><td><strong>${esc(f.original_filename)}</strong></td><td>${esc(f.school_name)}</td><td>${esc(enexusFileProjects().find(p=>p.id==='CLOUD-'+f.project_id)?.name||'Linked project')}</td><td>${esc(f.category)}</td><td>${esc(new Date(f.uploaded_at).toLocaleString())}</td><td><div class="actions"><button class="secondary" type="button" data-district-download="${esc(f.id)}">Download</button>${enexusFileCanManage()?`<button class="danger" type="button" data-district-delete="${esc(f.id)}">Move to Recycle Bin</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`;
 host.querySelectorAll('[data-district-download]').forEach(b=>b.onclick=()=>enexusDownloadFile(rows.find(f=>f.id===b.dataset.districtDownload)));
 host.querySelectorAll('[data-district-delete]').forEach(b=>b.onclick=()=>districtDeleteFile(rows.find(f=>f.id===b.dataset.districtDelete)));
}
async function districtDeleteFile(f){
 if(!f||!enexusFileCanManage())return;
 if(!confirm('Move "'+f.original_filename+'" to the Recycle Bin?'))return;
 const reason=prompt('Reason for deletion (optional):','');if(reason===null)return;
 const {error}=await authClient.rpc('enexus_delete_project_file',{target_file_id:f.id,reason:reason||null});
 if(error)return alert('Delete failed: '+error.message);
 toast('File moved to Recycle Bin.');districtLoadFiles();
}
async function districtUploadFile(e){
 e.preventDefault();if(enexusFileBusy||!authClient||!currentUser)return;
 const project=enexusFileProjects().find(p=>p.id===document.getElementById('districtUploadProject').value);
 const file=document.getElementById('districtUploadInput')?.files?.[0];if(!project||!file)return alert('Select a linked project and file.');
 const ext=file.name.split('.').pop().toLowerCase();
 const valid=(file.type==='application/pdf'&&ext==='pdf')||(file.type==='image/jpeg'&&['jpg','jpeg'].includes(ext))||(file.type==='image/png'&&ext==='png');
 if(!valid||!ENEXUS_FILE_TYPES.includes(file.type)||file.size<1||file.size>ENEXUS_FILE_MAX)return alert('Choose a PDF, JPG or PNG file of 20 MB or less.');
 const button=document.getElementById('districtUploadButton');enexusFileBusy=true;button.disabled=true;button.textContent='Uploading…';
 const path=project.school_name+'/'+project.id.slice(6)+'/'+crypto.randomUUID()+'.'+ext;
 try{
  const {error:uploadError}=await authClient.storage.from(ENEXUS_FILE_BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(uploadError)throw uploadError;
  const {error:metadataError}=await authClient.from('enexus_project_files').insert({project_id:project.id.slice(6),school_name:project.school_name,category:document.getElementById('districtUploadCategory').value,original_filename:file.name,storage_path:path,content_type:file.type,uploaded_by:currentUser.id});
  if(metadataError)throw new Error('File uploaded to storage, but metadata registration failed: '+metadataError.message+'. Report this storage path to an administrator for reconciliation: '+path);
  document.getElementById('districtUploadInput').value='';toast('Attachment uploaded successfully.');await districtLoadFiles();
 }catch(err){console.error('District file upload',err);alert('Upload failed: '+(err.message||String(err)));}
 finally{enexusFileBusy=false;if(document.getElementById('districtUploadButton')){button.disabled=false;button.textContent='Upload attachment';}}
}
const districtOriginalRender=render;
render=function(){districtOriginalRender();if(page==='records'&&currentUser)districtMountFiles();};

initAuth();
</script>
