;border:1px solid #ccd7e2;border-radius:8px;padding:10px 11px;background:white;color:var(--ink)}.toolbar input{min-width:180px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:13px 14px;text-align:left;border-bottom:1px solid #e8edf2;font-size:12px;vertical-align:top}th{background:#f8fafc;color:#53687c;font-size:10px;text-transform:uppercase;letter-spacing:.7px}tr:last-child td{border-bottom:0}td strong{font-size:12px}td .sub{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.4}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:11px;padding:7px 9px}.empty{text-align:center;padding:36px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgroup label{display:block;font-size:12px;font-weight:750;margin-bottom:6px;color:#42566a}.formgroup.full{grid-column:1/-1}.formgroup textarea{min-height:86px;resize:vertical}.formactions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.notice{padding:12px 14px;border-radius:10px;background:#fff6df;color:#74520b;border:1px solid #f4dfaa;font-size:12px;line-height:1.5;margin-bottom:16px}.sectiontitle{font-size:22px;margin:0 0 6px}.sectiondesc{color:var(--muted);margin:0 0 20px;font-size:13px;line-height:1.5}.timeline{display:flex;flex-direction:column;gap:10px}.timelineitem{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:5px;flex:none}.timelineitem strong{font-size:12px}.timelineitem p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.5}.footer{text-align:center;color:#8190a0;font-size:11px;padding:25px}.toast{position:fixed;right:22px;bottom:22px;background:#153b5c;color:white;padding:13px 17px;border-radius:10px;box-shadow:0 8px 30px #122d4833;display:none;z-index:10}.modalback{position:fixed;inset:0;background:#10263e77;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{background:white;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 70px #10263e44}.modal h3{margin:0 0 18px}.closex{float:right;background:#eef2f6;color:#28445e;padding:6px 10px}.reportbox{background:#f8fafc;border:1px solid var(--line);padding:18px;border-radius:12px;line-height:1.65;font-size:13px;white-space:pre-wrap}.hidden{display:none!important}
 .loginbar{display:flex;align-items:center;gap:8px}.loginbar button{padding:8px 11px;font-size:11px}.eventcard{display:flex;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:white}.datebox{flex:none;width:58px;height:64px;border-radius:10px;background:#e8f0f8;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center}.datebox b{font-size:23px;line-height:1}.datebox small{font-size:10px;font-weight:800;text-transform:uppercase;margin-top:4px}.eventbody{flex:1;min-width:0}.eventbody h4{margin:2px 0 5px;font-size:14px}.eventbody p{font-size:12px;color:var(--muted);margin:0 0 7px;line-height:1.5}.chatlayout{display:grid;grid-template-columns:270px 1fr;min-height:490px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:white}.chatlist{border-right:1px solid var(--line);padding:12px}.chatcontact{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:white;color:var(--ink);padding:12px;border-radius:10px;margin:3px 0}.chatcontact.active,.chatcontact:hover{background:#edf4fa}.contactavatar{width:35px;height:35px;flex:none;border-radius:50%;background:#e5eef7;color:var(--navy);display:grid;place-items:center;font-weight:800}.contactmeta{min-width:0}.contactmeta b{display:block;font-size:12px}.contactmeta small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.chatwindow{display:flex;flex-direction:column;min-width:0}.chathead{padding:15px;border-bottom:1px solid var(--line);font-weight:800;font-size:13px}.chatmessages{flex:1;min-height:280px;max-height:420px;overflow:auto;padding:16px;background:#f8fafc}.bubble{max-width:82%;padding:10px 12px;border-radius:12px;background:white;border:1px solid var(--line);margin:8px 0;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:#e4f1fb;border-color:#c4dff3}.bubble small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.chatcompose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.chatcompose input{min-width:0}.rolechip{display:inline-flex;padding:4px 8px;border-radius:99px;background:#e8eef5;color:#35516c;font-size:10px;font-weight:800}.loginoverlay{position:fixed;inset:0;z-index:50;background:#10263ee8;display:flex;align-items:center;justify-content:center;padding:18px}.loginbox{width:100%;max-width:440px;max-height:94vh;overflow-y:auto;background:white;border-radius:18px;padding:28px;box-shadow:0 20px 80px #0004}.loginbrand{display:flex;gap:12px;align-items:center;margin-bottom:22px}.loginbox h2{font-size:22px;margin:0 0 7px}.loginbox p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 18px}.loginbox .formgroup{margin-bottom:13px}.demoaccount{background:#f6f8fb;border-radius:10px;padding:12px;margin-top:16px;font-size:11px;line-height:1.7;color:#526578}.modal .formgrid{margin-top:12px}

@media(max-width:560px){.welcome{padding:20px}.welcome h3{font-size:20px}.welcomeicon{display:none}.stats{gap:9px}.stat{padding:13px}.stat .value{font-size:25px}.formgrid{grid-template-columns:1fr}.formgroup.full{grid-column:auto}.topright .rolelabel{display:none}.quickgrid{grid-template-columns:1fr}}
/* District dashboard layout: preserve original brand colors */
.app{grid-template-columns:258px minmax(0,1fr)}
.sidebar{height:100vh;position:sticky;top:0;overflow-y:auto;padding:20px 13px 14px;gap:12px;scrollbar-width:thin;scrollbar-color:#ffffff44 transparent}
.sidebar .brand{padding:8px 10px 18px;margin-bottom:2px}
.sidebar .navrow{display:flex;flex-direction:column;gap:3px!important}
.sidebar .navbtn{min-height:39px;padding:10px 12px;border-radius:9px;font-size:12px}
.sidebar .navlabel{margin:9px 10px 2px}
.sidebarbottom{margin-top:auto;border-top:1px solid #ffffff2c;padding-top:10px}
.sidebarbottom .sidebarfoot{margin-top:0;padding:8px 10px 12px;font-size:10px}
.sidebarlogout{display:flex;align-items:center;gap:12px;width:100%;background:transparent;color:#ffe3de;text-align:left;border:1px solid #ffffff30;border-radius:9px;padding:12px;font-size:13px}
.sidebarlogout:hover,.sidebarlogout:focus-visible{background:#ffffff20;color:white}
.sidebarlogout span{font-size:20px;line-height:1}
.topbar{height:70px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #10263e0b}
.content{max-width:1600px;padding:24px 26px}
.panel,.stat{box-shadow:0 2px 10px #12345a0a}
.stat{border-radius:12px}
.panel{border-radius:14px}
@media(max-width:950px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative;overflow:visible}.sidebar .navrow{flex-direction:row!important;overflow:auto}.sidebarbottom{margin-top:4px;display:flex;align-items:center;justify-content:space-between;gap:12px}.sidebarbottom .sidebarfoot{display:block;padding:5px 10px}.sidebarlogout{width:auto;white-space:nowrap}.topbar{position:relative}}
@media(max-width:560px){.sidebarbottom .sidebarfoot{display:none}.sidebarbottom{justify-content:flex-end}.content{padding:16px}}

/* Larger, clearer sidebar navigation labels and symbols */
@media (min-width:951px){
  .app{grid-template-columns:305px minmax(0,1fr)}
  .sidebar{padding:22px 15px 16px}
}
.sidebar .navbtn{font-size:15px;font-weight:750;min-height:53px;padding:13px 14px;gap:15px;line-height:1.35}
.sidebar .navbtn span{display:inline-flex;align-items:center;justify-content:center;flex:0 0 30px;width:30px;min-width:30px;font-size:24px;line-height:1.1}
.sidebar .navlabel{font-size:12px;font-weight:800;letter-spacing:1.5px;margin:13px 12px 5px}
.sidebar .brand h1{font-size:20px}
.sidebar .brand small{font-size:12px}
.sidebar .brandmark{width:48px;height:48px;font-size:23px;flex-shrink:0}
.sidebarlogout{font-size:16px;font-weight:750;min-height:54px;padding:13px 14px;gap:15px}
.sidebarlogout span{font-size:26px;display:inline-flex;justify-content:center;width:30px}
@media(max-width:950px){
  .sidebar .navbtn{font-size:14px;min-height:48px;padding:11px 13px}
  .sidebar .navbtn span{font-size:22px;flex-basis:28px;width:28px;min-width:28px}
}

/* Project e-NEXUS school and district branding */
.enexus-brand{display:flex!important;flex-direction:column;align-items:stretch!important;gap:12px!important}
.enexus-brand-title{display:flex;align-items:center;gap:12px}
.enexus-seals{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.enexus-seals img{width:78px;height:78px;object-fit:contain;background:white;border-radius:50%;padding:5px;box-shadow:0 2px 10px #0002}
.sidebar .enexus-seals img{width:86px;height:86px}
.loginbox .enexus-seals{margin:4px 0 18px}
.loginbox .enexus-seals img{width:74px;height:74px;border:1px solid #e3e9ef}
@media(max-width:560px){.sidebar .enexus-seals img{width:68px;height:68px}}

/* Detailed vector navigation icons: no external image or icon library needed */
.sidebar .navbtn .nav-icon-frame,.sidebarlogout .nav-icon-frame{width:37px;height:37px;min-width:37px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(229,181,75,.13);color:#f4c967;border:1px solid rgba(229,181,75,.22);flex-shrink:0}
.sidebar .navbtn .enexus-nav-icon,.sidebarlogout .enexus-nav-icon{width:25px;height:25px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.sidebar .navbtn.active .nav-icon-frame,.sidebar .navbtn:hover .nav-icon-frame{background:#e5b54b;color:#12345a;border-color:#f5d78d}
.sidebarlogout .nav-icon-frame{color:#ffd0c8;background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18)}
.sidebar .navbtn{gap:13px}

/* All create/edit/view forms open as embedded page sections, never floating overlays. */
.enexus-inline-editor[hidden]{display:none!important}
.enexus-inline-editor{position:relative;z-index:1;margin:22px 26px 0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px #12345a0a;scroll-margin-top:90px}
.enexus-inline-editor-inner{padding:22px 24px;max-width:1150px;margin:auto}
.enexus-inline-editor-tools{display:flex;justify-content:flex-end;margin-bottom:8px}
.enexus-inline-editor h3{font-size:20px;margin:0 0 18px;color:var(--navy)}
.enexus-inline-editor .formgrid{margin-top:12px}
@media(max-width:560px){.enexus-inline-editor{margin:14px 16px 0}.enexus-inline-editor-inner{padding:16px}}

/* Up to five School Personnel cards per row; add rows only as records exist. */
.enexus-school-personnel-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start;margin:0 auto 16px}
.enexus-school-personnel-grid > *{min-width:0;max-width:100%}
@media(max-width:1150px){.enexus-school-personnel-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.enexus-school-personnel-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.enexus-school-personnel-grid{grid-template-columns:1fr}}

/* Use the Aliaga District seal in the original eN brandmark position. */
.enexus-district-brandmark{background:#fff!important;border-radius:50%!important;padding:3px!important;overflow:hidden;flex-shrink:0;box-shadow:0 2px 8px #0002}
.enexus-district-brandmark img{display:block;width:100%;height:100%;object-fit:contain;border-radius:50%}
.sidebar .enexus-district-brandmark{width:54px;height:54px}
.loginbox .enexus-district-brandmark{width:52px;height:52px}
.enexus-password-wrap{display:block;position:relative;width:100%}
.enexus-password-wrap input{padding-right:76px!important}
button.enexus-password-eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);padding:5px 9px;font-size:12px;background:#e8eef5;color:#12345a;border:1px solid #ccd7e2;border-radius:6px;min-width:55px}
button.enexus-password-eye:focus-visible{outline:2px solid #1e5b91;outline-offset:2px}
</style>
</head>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const seed={
 projects:[],
 indicators:[],
 docs:[],
 activities:[],
 users:[],
 chats:{},
 activity:[]
};
let db;
try{db=JSON.parse(localStorage.getItem('enexusData'))||structuredClone(seed)}catch(e){db=JSON.parse(JSON.stringify(seed))}
db.activities ||= JSON.parse(JSON.stringify(seed.activities));
db.users ||= JSON.parse(JSON.stringify(seed.users));
db.chats ||= {};
// One-time cleanup of legacy sample content stored by older website versions.
// Do not erase genuine records or messages from real registered users.
const enexusLegacySeedIds = {
 projects: new Set(['PRJ-001','PRJ-002']),
 indicators: new Set(['IND-001','IND-002']),
 docs: new Set(['DOC-2026-001','DOC-2026-002']),
 activities: new Set(['ACT-001','ACT-002','ACT-003']),
 users: new Set(['USR-001','USR-002','USR-003'])
};
for(const [kind, ids] of Object.entries(enexusLegacySeedIds)) {
 if(Array.isArray(db[kind])) db[kind]=db[kind].filter(item=>!ids.has(String(item?.id||'')));
}
const enexusSampleTexts=new Set([
 'Welcome to the Project e-NEXUS coordination space. Please use this sample chat to test partner communication.',
 'We can coordinate upcoming activities and program support here.',
 'Please share project updates and action items in the appropriate channel.'
]);
for(const [channel, messages] of Object.entries(db.chats)) {
 if(!Array.isArray(messages)) {delete db.chats[channel];continue;}
 const kept=messages.filter(m=>m &&
   !/^(school personnel demo|partner agency demo)$/i.test(String(m.sender||'').trim()) &&
   !(m.time==='Sample message' && enexusSampleTexts.has(m.text)));
 if(kept.length) db.chats[channel]=kept;
 else delete db.chats[channel];
}
// Persist cleanup so removed demonstration content does not return on refresh.
try{localStorage.setItem('enexusData',JSON.stringify(db));}catch(e){console.warn('Could not persist legacy sample cleanup',e);}

let currentUser=null, currentChat=Object.keys(db.chats)[0]||'';
let page='login', query='', filter='All';
// Remember the selected module for each signed-in user, without storing credentials.
function enexusPageKey(userId){return 'enexus:last-page:'+userId;}
function enexusRememberPage(){
 if(!currentUser||!canViewPage(page))return;
 try{sessionStorage.setItem(enexusPageKey(currentUser.id),page);}catch(e){}
}
function enexusRestorePage(){
 let saved='';
 try{saved=sessionStorage.getItem(enexusPageKey(currentUser.id))||'';}catch(e){}
 return saved&&canViewPage(saved)?saved:(isSystemAdmin()?'dashboard':isICTCoordinator()?'monitoring':'projects');
}
function save(){const local={...db,projects:db.projects.filter(x=>!String(x.id).startsWith('CLOUD-')),docs:db.docs.filter(x=>!String(x.id).startsWith('LINK-')),indicators:db.indicators.filter(x=>!String(x.id).startsWith('LINK-'))};localStorage.setItem('enexusData',JSON.stringify(local))}
function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function log(msg){db.activity.unshift({date:new Date().toLocaleString(),msg});db.activity=db.activity.slice(0,30);save()}
function statusPill(s){let cls=/complete|approved|released|received|closed/i.test(s)?'green':/overdue|rejected|returned/i.test(s)?'red':/review|progress|pending|routed/i.test(s)?'amber':'';return `<span class="pill ${cls}">${esc(s)}</span>`}
function projectName(id){return db.projects.find(p=>p.id===id)?.name||'Unassigned'}
// UI navigation only: Supabase RLS must independently enforce per-school data access.
const ENEXUS_ADMIN_ONLY_PAGES=new Set(['dashboard','activities','updates','transparency','users','settings']);
const ENEXUS_ICT_PAGES=new Set(['monitoring','records']);
function isSystemAdmin(){return currentUser?.role==='Administrator';}
function isICTCoordinator(){return !!currentUser && !isSystemAdmin() && (currentUser.role==='ICT Coordinator Moderator'||(currentUser.role==='School Personnel'&&currentUser.position_in_school==='ICT Coordinator'));}
function canViewPage(p){if(isSystemAdmin())return true;if(enexusCanAccessSchoolRecords()&&p==='records')return true;if(isICTCoordinator())return ENEXUS_ICT_PAGES.has(p);if(p==='transparency')return !!currentUser && currentUser.role==='School Personnel' && currentUser.approved===true && currentUser.account_status==='Approved' && currentUser.access_revoked!==true && !!currentUser.school_name;if(ENEXUS_ICT_PAGES.has(p))return false;if(ENEXUS_ADMIN_ONLY_PAGES.has(p))return false;return ['projects','documents','community','announcements','orgchart','reports'].includes(p);}
function enexusIsApprovedAOII(){return !!currentUser && currentUser.role==='School Personnel' && currentUser.approved===true && currentUser.access_revoked!==true && currentUser.account_status==='Approved' && /^(administrative officer ii|ao ii)$/i.test(String(currentUser.position_in_school||'').trim()) && ENEXUS_SCHOOLS.includes(currentUser.school_name);}
function enexusCanCreateProject(){return ['Administrator','School Administrator','Project Coordinator'].includes(currentUser?.role)||enexusIsApprovedAOII();}
function canEditMonitoring(){return isSystemAdmin();}
function canEditTracing(){return isSystemAdmin() || (currentUser?.role==='Program Coordinator') || (currentUser?.role==='ICT Coordinator Moderator') || (currentUser?.position_in_school==='Program Coordinator' && currentUser?.role==='School Personnel') || (currentUser?.position_in_school==='ICT Coordinator' && currentUser?.role==='School Personnel');}
function requireModuleEdit(kind){if(kind==='monitoring'&&!canEditMonitoring()){toast('Only the District System Administrator can edit Monitoring & Evaluation.');return false;}if(kind==='documents'&&!canEditTracing()){toast('Only the Administrator, Program Coordinator, or ICT Coordinator can edit Document Tracing.');return false;}return true;}
function schoolScopedRows(rows){if(!isICTCoordinator()&&!enexusCanAccessSchoolRecords())return rows;return rows.filter(r=>r.school_name && r.school_name===currentUser.school_name);}
function setPage(p){closeModal();if(!currentUser){showLogin();return}if(!canViewPage(p)){toast('This section is not available for your account.');return}page=p;query='';enexusRememberPage();document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function render(){
 if(!currentUser){showLogin();return}
 $('#userLabel').textContent=currentUser.name+' • '+currentUser.role;
 $('#userAvatar').textContent=(currentUser.name||'eN').split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase();
 document.querySelectorAll('.navbtn[data-page]').forEach(b=>{b.classList.toggle('hidden',!canViewPage(b.dataset.page));b.classList.toggle('active',b.dataset.page===page);});
 document.querySelectorAll('.navlabel').forEach(label=>{if(label.textContent.trim()==='ADMINISTRATION')label.classList.toggle('hidden',!isSystemAdmin());});
 if(!canViewPage(page))page=isSystemAdmin()?'dashboard':isICTCoordinator()?'monitoring':'projects';
 enexusRememberPage();
 let titles={dashboard:'Dashboard',projects:'Projects & Programs',monitoring:'Monitoring & Evaluation',reports:'Reports',documents:'Document Tracing',records:'Records & Retrieval',settings:'Settings & Data',activities:'Activities & Calendar',community:'Partner Chat',users:'Users & Access',announcements:'Announcements',orgchart:'Organizational Chart',updates:'Project Status Updates',transparency:'Transparency Register'};
 $('#pageTitle').textContent=titles[page]||'Projects & Programs';
 let f={dashboard:dashboardPage,projects:projectsPage,monitoring:monitorPage,reports:reportsPage,documents:documentsPage,records:recordsPage,settings:settingsPage,activities:activitiesPage,community:communityPage,users:usersPage,announcements:announcementsPage,orgchart:orgchartPage,updates:updatesPage,transparency:transparencyPage};
 $('#content').innerHTML=(page==='monitoring'&&isICTCoordinator())?ictMonitoringPage():(page==='records'&&(isICTCoordinator()||enexusCanAccessSchoolRecords()))?ictRecordsPage():f[page]();
 wire();
 if(page==='users')loadUsersDirectory();
 if(['announcements','updates','transparency'].includes(page))loadCloudModule(page);
 if(page==='orgchart')loadOrgChart();
 if(['projects','monitoring','documents','dashboard','reports','records'].includes(page))loadSharedProjects();
}
function ictMonitoringPage(){
 const rows=schoolScopedRows(db.indicators).filter(x=>JSON.stringify(x).toLowerCase().includes(query.toLowerCase()));
 return `<h3 class="sectiontitle">Monitoring & Evaluation</h3><p class="sectiondesc">${esc(currentUser.school_name)} • School records</p><div class="toolbar"><input id="search" placeholder="Search indicators…" value="${esc(query)}"></div><div class="tablewrap"><table><thead><tr><th>Indicator</th><th>Project</th><th>Target</th><th>Actual</th><th>Achievement</th><th>Updated</th></tr></thead><tbody>${rows.map(i=>{let pct=Number(i.target)>0?Math.round(Number(i.actual)/Number(i.target)*100):0;return `<tr><td>${esc(i.name)}</td><td>${esc(projectName(i.project))}</td><td>${esc(i.target)}</td><td>${esc(i.actual)}</td><td>${pct}%</td><td>${esc(i.date||'—')}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No school-linked indicators available.</td></tr>'}</tbody></table></div>`;
}
function ictRecordsPage(){
 const rows=schoolScopedRows(db.docs).filter(x=>JSON.stringify(x).toLowerCase().includes(query.toLowerCase()));
 return `<h3 class="sectiontitle">Records & Retrieval</h3><p class="sectiondesc">${esc(currentUser.school_name)} • School records</p><div class="toolbar"><input id="search" placeholder="Search school records…" value="${esc(query)}"></div><div class="tablewrap"><table><thead><tr><th>Record ID</th><th>Document</th><th>Type</th><th>Status</th><th>Location</th></tr></thead><tbody>${rows.map(d=>`<tr><td>${esc(d.id)}</td><td>${esc(d.title)}</td><td>${esc(d.type)}</td><td>${statusPill(d.status)}</td><td>${esc(d.location||'—')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No school-linked records available.</td></tr>'}</tbody></table></div>`;
}
function dashboardPage(){
 let active=db.projects.filter(p=>p.status==='In Progress').length, pending=db.docs.filter(d=>!/complete|approved|released|closed/i.test(d.status)).length, avg=db.projects.length?Math.round(db.projects.reduce((a,p)=>a+Number(p.progress||0),0)/db.projects.length):0;
 return `<section class="welcome"><div><div class="tag">APPROVED PROJECT • DIGITAL WORKSPACE</div><h3>Welcome to Project e-NEXUS</h3><p>A unified workspace for planning and monitoring programs, evaluating performance, routing documents, and organizing official records.</p></div><div class="welcomeicon" aria-label="Digital workspace">✦</div></section>
 <div class="stats"><div class="stat"><div class="label">Registered Programs / Projects</div><div class="value">${db.projects.length}</div><div class="hint">Across the project workspace</div></div><div class="stat"><div class="label">Projects In Progress</div><div class="value">${active}</div><div class="hint">Current implementation status</div></div><div class="stat"><div class="label">Documents in Workflow</div><div class="value">${pending}</div><div class="hint">Not yet closed or completed</div></div><div class="stat"><div class="label">Average Project Progress</div><div class="value">${avg}%</div><div class="hint">Based on entered progress values</div></div></div>
 <div class="twocol"><div class="panel"><div class="panelhead"><div><h3>Project implementation overview</h3><p>Progress values are manually updated by authorized users.</p></div><button class="secondary" data-go="projects">View all</button></div>${db.projects.length?db.projects.slice(0,5).map(p=>`<div style="margin:18px 0"><div style="display:flex;justify-content:space-between;gap:12px"><strong style="font-size:12px">${esc(p.name)}</strong>${statusPill(p.status)}</div><div class="bar"><span style="width:${Math.max(0,Math.min(100,Number(p.progress)||0))}%"></span></div><div style="font-size:11px;color:var(--muted)">${Number(p.progress)||0}% complete • Lead: ${esc(p.owner||'Not assigned')}</div></div>`).join(''):'<div class="empty">No projects yet. Add a project to begin.</div>'}</div>
 <div class="panel"><div class="panelhead"><div><h3>Quick actions</h3><p>Start a common workflow.</p></div></div><div class="quickgrid"><div class="quick"><span>◫</span><strong>Register a project</strong><p>Create a project record, timeline and lead.</p>${enexusCanCreateProject()?'<button data-action="add-project">Add project</button>':''}</div><div class="quick"><span>▣</span><strong>Track a document</strong><p>Register incoming or outgoing documents.</p>${canEditTracing()?`<button data-action="add-doc">Add document</button>`:''}</div><div class="quick"><span>◷</span><strong>Record performance</strong><p>Update indicator targets and actual results.</p>${canEditMonitoring()?`<button data-action="add-indicator">Add indicator</button>`:''}</div><div class="quick"><span>▤</span><strong>Generate report</strong><p>Prepare a live summary from saved records.</p><button data-go="reports" class="secondary">Open reports</button></div></div></div></div>
 <div class="panel" style="margin-top:18px"><div class="panelhead"><div><h3>Upcoming school activities</h3><p>Shared events and program announcements.</p></div><button class="secondary" data-go="activities">View calendar</button></div>${db.activities.filter(a=>a.date>=today()&&a.status!=='Cancelled').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(a=>`<div class="eventcard"><div class="datebox"><b>${new Date(a.date+'T12:00:00').getDate()}</b><small>${new Date(a.date+'T12:00:00').toLocaleString('en',{month:'short'})}</small></div><div class="eventbody"><h4>${esc(a.title)}</h4><p>${esc(a.time||'Time TBA')} • ${esc(a.venue||'Venue TBA')}</p>${statusPill(a.status)}</div></div>`).join('')||'<div class="empty">No upcoming activities have been scheduled.</div>'}</div>
`
}
function projectsPage(){let canManage=enexusCanCreateProject(),canModify=canManage&&!enexusIsApprovedAOII();return `<h3 class="sectiontitle">Projects &amp; Programs</h3><p class="sectiondesc">Register school projects and programs, define objectives and timelines, assign leads, and monitor implementation progress. Use the New project button to add a program or project and Export CSV to download the list.</p><div class="panel" style="margin-bottom:14px"><div class="panelhead"><div><h3>Project and program workspace</h3><p>Register new initiatives, track their status and progress, and edit or remove existing entries.</p></div><span class="pill">${db.projects.length} registered</span></div><div class="stats"><div class="stat"><div class="label">Planned</div><div class="value">${db.projects.filter(p=>p.status==='Planned').length}</div></div><div class="stat"><div class="label">In progress</div><div class="value">${db.projects.filter(p=>p.status==='In Progress').length}</div></div><div class="stat"><div class="label">Completed</div><div class="value">${db.projects.filter(p=>p.status==='Completed').length}</div></div></div></div><div class="toolbar"><input id="search" placeholder="Search projects or programs…" value="${esc(query)}"><select id="statusFilter"><option>All</option>${['Planned','In Progress','On Hold','Completed','Cancelled'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select>${canManage?'<button data-action="add-project">+ New project / program</button>':''}<button class="secondary" data-action="export-projects">Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>Project</th><th>Project Coordinator / Lead</th><th>Timeline</th><th>Status</th><th>Progress</th>${canModify?'<th>Actions</th>':''}</tr></thead><tbody>${db.projects.filter(p=>(filter==='All'||p.status===filter)&&JSON.stringify(p).toLowerCase().includes(query.toLowerCase())).map(p=>`<tr><td><strong>${esc(p.name)}</strong>${p.objective?`<span class="sub">${esc(p.objective)}</span>`:''}</td><td>${esc(p.owner||'—')}</td><td>${esc(p.start||'—')}<span class="sub">to ${esc(p.end||'—')}</span></td><td>${p.is_archived?`<span class="pill amber">Archived</span> `:""}${statusPill(p.status)}</td><td><strong>${Number(p.progress)||0}%</strong><div class="bar"><span style="width:${Math.max(0,Math.min(100,Number(p.progress)||0))}%"></span></div></td>${canModify?`<td><div class="actions"><button class="secondary" data-edit-project="${p.id}">Edit</button>${String(p.id).startsWith('CLOUD-')?`<button class="danger" data-permanent-delete-project="${p.id}">Delete</button>`:`<button class="danger" data-delete-project="${p.id}">Delete local</button>`}</div></td>`:''}</tr>`).join('')||`<tr><td colspan="${canModify?6:5}" class="empty">No matching projects.</td></tr>`}</tbody></table></div>`}
function monitorPage(){return `<h3 class="sectiontitle">Monitoring & Evaluation</h3><p class="sectiondesc">Track performance indicators against targets and actual results. These records can inform periodic evaluation and accomplishment reporting.</p><div class="toolbar"><input id="search" placeholder="Search indicators…" value="${esc(query)}">${canEditMonitoring()?`<button data-action="add-indicator">+ Add indicator</button>`:''}<button class="secondary" data-action="export-indicators">Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>Indicator</th><th>Linked project</th><th>Target</th><th>Actual</th><th>Achievement</th><th>Last updated</th><th>Actions</th></tr></thead><tbody>${db.indicators.filter(i=>JSON.stringify(i).toLowerCase().includes(query.toLowerCase())).map(i=>{let pct=Number(i.target)>0?Math.round(Number(i.actual)/Number(i.target)*100):0;return `<tr><td><strong>${esc(i.name)}</strong>${String(i.id).startsWith('LINK-')?'':`<span class="sub">${esc(i.unit||'')}</span>`}</td><td>${esc(projectName(i.project))}</td><td>${esc(i.target)}</td><td>${esc(i.actual)}</td><td><strong>${pct}%</strong><div class="bar"><span style="width:${Math.min(100,Math.max(0,pct))}%"></span></div></td><td>${esc(i.date||'—')}</td><td><div class="actions">${canEditMonitoring()?`<button class="secondary" data-edit-indicator="${i.id}">Edit</button><button class="danger" data-delete-indicator="${i.id}">Delete</button>`:'<span class="sub">View only</span>'}</div></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No indicators recorded.</td></tr>'}</tbody></table></div>`}
function documentsPage(){return `<h3 class="sectiontitle">Document Tracing & Management</h3><p class="sectiondesc">Register documents, route them to the next responsible office or person, and maintain a traceable status history. Saved milestones and status are reflected below.</p><div class="toolbar"><input id="search" placeholder="Search title, ID, person or remarks…" value="${esc(query)}"><select id="statusFilter"><option>All</option>${['Received','For Review','Routed','Submitted to Division','Approved by Division','Received by District','Released by District','Pending Action','Approved','Released','Returned','Completed','Closed'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select>${canEditTracing()?`<button data-action="add-doc">+ Register document</button>`:''}<button class="secondary" data-action="export-docs">Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>Document</th><th>From → To</th><th>Date received</th><th>Submitted to Division</th><th>Approved by Division</th><th>Received by District</th><th>Released by District</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.docs.filter(d=>(filter==='All'||d.status===filter)&&JSON.stringify(d).toLowerCase().includes(query.toLowerCase())).map(d=>`<tr><td><strong>${esc(d.title)}</strong><span class="sub">${String(d.id).startsWith('LINK-')?'':`${esc(d.id)} • `}${esc(d.type)}</span></td><td>${esc(d.from||'—')}<span class="sub">→ ${esc(d.to||'—')}</span></td><td>${esc(d.date||'—')}</td><td>${esc(d.date_submitted_division||'—')}</td><td>${esc(d.date_approved_division||'—')}</td><td>${esc(d.date_received_district||'—')}</td><td>${esc(d.date_released_district||'—')}</td><td>${statusPill(d.status)}${d.remarks?`<span class="sub">${esc(d.remarks)}</span>`:''}</td><td><div class="actions">${canEditTracing()?`<button data-route-doc="${esc(d.id)}">Update / Route</button><button class="secondary" data-edit-doc="${esc(d.id)}">Edit</button>`:'<span class="sub">View only</span>'}${currentUser.role==='Administrator'?`<button class="danger" data-delete-doc="${esc(d.id)}">Delete</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No matching documents.</td></tr>'}</tbody></table></div>`}
function recordsPage(){return `<h3 class="sectiontitle">Records & Retrieval</h3><p class="sectiondesc">Search and retrieve document metadata from the registered records. Add file reference details and follow your office's official records-retention and access policies.</p><div class="toolbar"><input id="search" placeholder="Search all registered records…" value="${esc(query)}"><button class="secondary" data-action="export-docs">Export records CSV</button></div><div class="stats"><div class="stat"><div class="label">Total records</div><div class="value">${db.docs.length}</div></div><div class="stat"><div class="label">High priority</div><div class="value">${db.docs.filter(d=>d.priority==='High').length}</div></div><div class="stat"><div class="label">Approved / Released</div><div class="value">${db.docs.filter(d=>/approved|released|completed|closed/i.test(d.status)).length}</div></div><div class="stat"><div class="label">Returned</div><div class="value">${db.docs.filter(d=>d.status==='Returned').length}</div></div></div><div class="tablewrap"><table><thead><tr><th>Record ID</th><th>Document title</th><th>Type</th><th>Status</th><th>Location</th><th>Record details</th></tr></thead><tbody>${db.docs.filter(d=>JSON.stringify(d).toLowerCase().includes(query.toLowerCase())).map(d=>`<tr><td><strong>${String(d.id).startsWith('LINK-')?'Linked project':esc(d.id)}</strong></td><td>${esc(d.title)}</td><td>${esc(d.type)}</td><td>${statusPill(d.status)}</td><td>${esc(d.location||'—')}</td><td><div class="actions">${canEditTracing()?`<button class="secondary" data-edit-doc="${d.id}">View / edit</button>`:'<span class="sub">View only</span>'}${currentUser.role==='Administrator'?`<button class="danger" data-delete-doc="${esc(d.id)}">Delete</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No records match your search.</td></tr>'}</tbody></table></div>`}

// Password visibility controls apply to login, registration, recovery, and future forms.
function enexusInstallPasswordEyes(){
 document.querySelectorAll('input[type="password"],input[data-enexus-password-eye]').forEach(input=>{
  if(input.dataset.enexusPasswordEye)return;
  input.dataset.enexusPasswordEye='1';
  const wrap=document.createElement('span');
  wrap.className='enexus-password-wrap';
  input.parentNode.insertBefore(wrap,input);
  wrap.appendChild(input);
  const btn=document.createElement('button');
  btn.type='button';btn.className='enexus-password-eye';
  btn.setAttribute('aria-label','Show password');btn.setAttribute('aria-pressed','false');
  btn.textContent='Show';
  btn.addEventListener('click',()=>{
   const visible=input.type==='text';input.type=visible?'password':'text';
   btn.textContent=visible?'Show':'Hide';
   btn.setAttribute('aria-label',visible?'Show password':'Hide password');
   btn.setAttribute('aria-pressed',String(!visible));
  });
  wrap.appendChild(btn);
 });
}
const enexusPasswordObserver=new MutationObserver(()=>enexusInstallPasswordEyes());
if(document.body)enexusPasswordObserver.observe(document.body,{childList:true,subtree:true});

const enexusResetCooldownMs=60000;
const enexusResetLastSent=new Map();
const enexusResetPending=new Set();
async function enexusRequestPasswordReset(email,button,onStatus){
 if(!authClient){onStatus('Authentication is not ready. Please refresh and try again.');return;}
 const address=String(email||'').trim().toLowerCase();
 if(!address){onStatus('Please enter your registered email address.');return;}
 if(enexusResetPending.has(address)){onStatus('A password reset request is already being processed.');return;}
 const elapsed=Date.now()-(enexusResetLastSent.get(address)||0);
 if(elapsed<enexusResetCooldownMs){onStatus('Please wait '+Math.ceil((enexusResetCooldownMs-elapsed)/1000)+' seconds before requesting another reset email.');return;}
 enexusResetPending.add(address);
 if(button)button.disabled=true;
 try{
  const {error}=await authClient.auth.resetPasswordForEmail(address,{
   redirectTo:'https://aliagadistrict.github.io/https-project-e-nexus.netlify.app-/'
  });
  if(error)throw error;
  enexusResetLastSent.set(address,Date.now());
  onStatus('If this email is registered, a password-reset link will be sent. Check your inbox and spam folder. Please do not request multiple emails.');
 }catch(err){
  const raw=String(err?.message||'');
  if(err?.status===429||/rate limit|too many requests|over_email_send_rate_limit/i.test(raw)){
   enexusResetLastSent.set(address,Date.now());
   onStatus('Supabase email sending limit reached. No new reset email can be sent right now. Wait for the limit to reset, or ask the system administrator to configure SMTP in Supabase Authentication. Repeated clicks will not resolve this.');
  }else{
   onStatus('Could not send the reset email: '+(raw||'Please try again.'));
  }
 }finally{
  enexusResetPending.delete(address);
  if(button)button.disabled=false;
 }
}

 $('#authSwitch').onclick=e=>{e.preventDefault();showLogin(isRegister?'login':'register')};
 const forgot=document.getElementById('authForgot');

 enexusInstallPasswordEyes();
 const closeAuth=document.getElementById('authClose');
 if(closeAuth){closeAuth.style.display='';closeAuth.onclick=()=>{if(isRegister){showLogin('login');}else{showPublicLanding();}};}
 if(isRegister){
  const form=document.getElementById('authForm');
  form.elements.account_type.addEventListener('change',updateRegistrationPositionOptions);
  form.elements.position.addEventListener('change',()=>{const other=form.elements.other_position;const position=form.elements.position.value;if(other){other.closest('.formgroup').style.display=position==='Other'?'':'none';other.required=position==='Other';}const hint=document.getElementById('coordinatorRegistrationHint');if(hint)hint.style.display=form.elements.account_type.value==='School Personnel'&&['ICT Coordinator','Program Coordinator'].includes(position)?'block':'none';});
  updateRegistrationPositionOptions();
 }
 $('#authForm').onsubmit=async e=>{
   e.preventDefault();
   if(!authClient){authMessage('Authentication is not configured yet. Add your Supabase project URL and publishable key in the code.');return;}
   if(authBusy)return;
   const data=Object.fromEntries(new FormData(e.target));const email=data.email.trim().toLowerCase();
   let selectedPosition='';
   if(isRegister){
    selectedPosition=data.position==='Other'?(data.other_position||'').trim():(data.position||'').trim();
    if(!data.account_type||!selectedPosition){authMessage('Select your account type and position before submitting.');return;}
   }
   authBusy=true;const submit=$('#authSubmit');submit.disabled=true;submit.textContent='Please wait…';
   try{
    if(isRegister){
      const {data:result,error}=await authClient.auth.signUp({email,password:data.password,options:{emailRedirectTo:'https://aliagadistrict.github.io/https-project-e-nexus.netlify.app-/',data:{full_name:data.full_name.trim(),school_name:data.school_name,account_type:data.account_type,agency:selectedPosition,position_in_school:data.account_type==='School Personnel'?selectedPosition:null}}});
      if(error)throw error;
      if(result.session){await loadAuthenticatedUser(result.session.user);}
      else showLogin('login','Registration submitted. Check your email if confirmation is enabled. Your account must be approved by an administrator before access is granted. Coordinator requests are subject to one approved account per position per school.');
    }else{
      const {data:result,error}=await authClient.auth.signInWithPassword({email,password:data.password});
      if(error)throw error;
      await loadAuthenticatedUser(result.user);
    }
   }catch(err){
     const raw=String(err?.message||'');
     if(err?.status===429||/email rate limit|over_email_send_rate_limit|too many requests/i.test(raw)){
       authMessage('Supabase has temporarily reached its email sending limit. Your registration may not have completed. Please do not keep retrying; ask the system administrator to verify the custom SMTP configuration and Authentication rate limits, then try again.');
     }else authMessage(raw||'Authentication failed. Please try again.');
   }
   finally{authBusy=false;const b=$('#authSubmit');if(b){b.disabled=false;b.textContent=isRegister?'Submit registration request':'Sign in';}}
 };
 if(message)authMessage(message);
}
async function loadAuthenticatedUser(authUser){
 if(!authClient||!authUser){currentUser=null;showLogin();return;}
 // Supabase can emit SIGNED_IN again when a browser tab regains focus.
 // Do not reset the active module or discard its unsaved form state.
 if(currentUser?.id===authUser.id && !document.getElementById('authOverlay'))return;
 const {data:profile,error}=await authClient.from('profiles').select('full_name,agency,role,approved,school_name,account_status,position_in_school,access_revoked').eq('id',authUser.id).maybeSingle();
 if(error){currentUser=null;showLogin('login','Could not verify your access profile. Ask the administrator to check the Supabase profiles table and Row Level Security settings.');return;}
 if(!profile||!profile.approved||profile.account_status!=='Approved'||profile.access_revoked===true){
   currentUser=null;
   await authClient.auth.signOut();
   showLogin('login','Your account is registered but is awaiting administrator approval. You cannot access the workspace yet.');
   return;
 }
 currentUser={id:authUser.id,email:authUser.email,name:profile.full_name||authUser.email,role:profile.role||'Partner Agency',agency:profile.agency||'',school_name:profile.school_name||'',position_in_school:profile.position_in_school||'',approved:profile.approved===true,account_status:profile.account_status||'',access_revoked:profile.access_revoked===true};
 if(document.getElementById('authOverlay'))document.getElementById('authOverlay').remove();
 page=enexusRestorePage();render();
}
function showForgotPassword(message=''){
 let overlay=document.getElementById('authOverlay');
 if(!overlay){overlay=document.createElement('div');overlay.id='authOverlay';overlay.className='loginoverlay';document.body.appendChild(overlay);}
 overlay.innerHTML=`<div class="loginbox"><h2>Reset your password</h2><p>Enter the email address used for your Project e-NEXUS account. You will receive a secure link to set a new password.</p><form id="forgotForm"><div class="formgroup"><label for="forgotEmail">Registered email</label><input id="forgotEmail" name="email" type="email" autocomplete="email" required></div><button type="submit" id="forgotSubmit">Send reset link</button></form><div id="forgotStatus" class="notice" role="status" style="display:${message?'block':'none'};margin-top:12px">${esc(message)}</div><p style="margin-top:16px"><a href="#" id="forgotBack">Back to sign in</a></p></div>`;
 document.getElementById('forgotBack').onclick=e=>{e.preventDefault();showLogin('login');};
 document.getElementById('forgotForm').onsubmit=async e=>{
  e.preventDefault();
  const form=e.currentTarget,btn=document.getElementById('forgotSubmit'),status=document.getElementById('forgotStatus');
  await enexusRequestPasswordReset(form.elements.email.value,btn,msg=>{status.textContent=msg;status.style.display='block';});
 };
}
let enexusPasswordRecoveryActive=false;
function showPasswordRecovery(){
 enexusPasswordRecoveryActive=true;
 let overlay=document.getElementById('authOverlay');
 if(!overlay){overlay=document.createElement('div');overlay.id='authOverlay';overlay.className='loginoverlay';document.body.appendChild(overlay);}
 overlay.innerHTML=`<div class="loginbox"><h2>Choose a new password</h2><p>Enter a new password for your Project e-NEXUS account. Use at least 8 characters.</p><form id="recoveryForm"><div class="formgroup"><label>New password</label><input name="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="formgroup"><label>Confirm new password</label><input name="confirm" type="password" minlength="8" autocomplete="new-password" required></div><button type="submit" id="recoverySubmit">Update password</button></form><div id="recoveryStatus" class="notice" role="status" style="display:none;margin-top:12px"></div></div>`;
 enexusInstallPasswordEyes();
 document.getElementById('recoveryForm').onsubmit=async e=>{
  e.preventDefault();
  const f=e.currentTarget,p=f.elements.password.value,c=f.elements.confirm.value,status=document.getElementById('recoveryStatus');
  const show=msg=>{status.textContent=msg;status.style.display='block';};
  if(p.length<8)return show('Use a password of at least 8 characters.');
  if(p!==c)return show('Passwords do not match.');
  const btn=document.getElementById('recoverySubmit');btn.disabled=true;

 ];

async function enexusLoadFiles(){

 }
 if(recycle){

 if(request!==enexusFileRequest||!document.querySelector('#enexusRecycleList'))return;
 if(result.error){recycle.textContent='Cannot load Recycle Bin: '+result.error.message;return;}
 const rows=(result.data||[]).filter(f=>f.project_id===projectId&&f.school_name===project.school_name);

 }
}
async function enexusUploadFile(event){
 event.preventDefault();if(enexusFileBusy||!authClient||!currentUser||!enexusFileCanUpload())return;
 const project=enexusFileProjects().find(p=>p.id===enexusFileProject);
 const file=document.querySelector('#enexusFileInput')?.files?.[0];
 if(!project||!file)return toast('Select a shared project and a file.');
 if(!isSystemAdmin()&&project.school_name!==currentUser?.school_name)return toast('Upload is restricted to your assigned school.');
 const ext=file.name.split('.').pop().toLowerCase();
 const valid=(file.type==='application/pdf'&&ext==='pdf')||(file.type==='image/jpeg'&&['jpg','jpeg'].includes(ext))||(file.type==='image/png'&&ext==='png');
 if(!valid||!ENEXUS_FILE_TYPES.includes(file.type))return toast('Only PDF, JPEG, and PNG files are allowed.');
 if(file.size>ENEXUS_FILE_MAX||!file.size)return toast('File must be between 1 byte and 20 MB.');
 const path=project.school_name+'/'+project.id.slice(6)+'/'+crypto.randomUUID()+'.'+ext;
 const category=document.querySelector('#enexusFileCategory').value;
 enexusFileBusy=true;const button=document.querySelector('#enexusFileUploadButton');if(button){button.disabled=true;button.textContent='Uploading…';}
 try{
  const {error:uploadError}=await authClient.storage.from(ENEXUS_FILE_BUCKET).upload(path,file,{contentType:file.type,upsert:false});
  if(uploadError)throw uploadError;
  const {error:metadataError}=await authClient.from('enexus_project_files').insert({project_id:project.id.slice(6),school_name:project.school_name,category,original_filename:file.name,storage_path:path,content_type:file.type,uploaded_by:currentUser.id});
  if(metadataError)throw new Error('Storage upload succeeded but metadata registration failed: '+metadataError.message+'. Contact your administrator to reconcile the orphaned Storage object: '+path);
  toast('Attachment uploaded successfully.');const input=document.querySelector('#enexusFileInput');if(input)input.value='';await enexusLoadFiles();
 }catch(error){console.error('Project attachment upload:',error);alert('Upload failed: '+(error.message||String(error)));}
 finally{enexusFileBusy=false;const b=document.querySelector('#enexusFileUploadButton');if(b){b.disabled=false;b.textContent='Upload File';}}
}
async function enexusDownloadFile(file){

 const {data,error}=await authClient.storage.from(ENEXUS_FILE_BUCKET).download(file.storage_path);
 if(error)return alert('Download failed: '+error.message);
 download(file.original_filename,data,file.content_type||'application/octet-stream');
}
async function enexusDeleteFile(file){

 const reason='Deleted using the Project e-NEXUS Delete button.';
 const {error}=await authClient.rpc('enexus_delete_project_file',{target_file_id:file.id,reason:reason||null});
 if(error)return alert('Delete failed: '+error.message);
 toast('File moved to Recycle Bin.');await enexusLoadFiles();

ts,btn=f.querySelector('[type="submit"]');if(v.type.value==='Other'&&!v.custom.value.trim())return alert('Specify the document type.');if(v.received.value>today())return alert('Date received cannot be in the future.');if(!v.origin.value||!v.receiving.value)return alert('Select the originating and receiving offices.');btn.disabled=true;try{const {data,error}=await authClient.rpc('enexus_register_document',{p_document_title:v.title.value.trim(),p_document_type:v.type.value,p_custom_document_type:v.type.value==='Other'?v.custom.value.trim():null,p_originating_office:v.origin.value.trim(),p_receiving_office:v.receiving.value.trim(),p_description:v.description.value.trim(),p_date_received:v.received.value});if(error)throw error;closeModal();toast('Document registered.');await tracingLoad();alert('Document registered successfully. Document ID: '+data);}catch(err){alert('Registration failed: '+(err.message||String(err)));}finally{btn.disabled=false}};}

 enexusSchoolApprovals=new Map((approvals.error?[]:(approvals.data||[])).map(a=>[a.document_id,a]));
 const reviewerSchools=[...new Set(enexusSchoolDocs.map(d=>d.school_name).filter(Boolean))];
 const reviewerResults=await Promise.all(reviewerSchools.map(target_school=>authClient.rpc('enexus_can_review_document',{target_school})));
 const reviewerAccess=new Map(reviewerSchools.map((name,i)=>[name,!reviewerResults[i].error&&reviewerResults[i].data===true]));
 list.innerHTML=enexusSchoolDocs.length?enexusSchoolDocs.map(d=>{
  const a=enexusSchoolApprovals.get(d.id),own=d.created_by===currentUser.id;
  const manage=canSubmit&&d.school_name===school&&(own||isAdmin);
  const status=a?.approval_status||'Draft';
  const upload=manage&&(!a||status==='Needs Revision');
  const submit=manage&&(!a||status==='Needs Revision');
  const review=!!a&&status==='Pending Approval'&&a.submitted_version_id&&a.submitted_by!==currentUser.id&&reviewerAccess.get(d.school_name)===true;
  return `<div class="timelineitem" style="display:block;margin:12px 0"><strong>${esc(d.title)}</strong><p>${esc(d.document_type||'Document')} · ${esc(d.school_name||'')} · ${esc(d.reference_number||'No reference')}</p><p>Status: <strong>${esc(status)}</strong>${a?.review_remarks?' · Reviewer remarks: '+esc(a.review_remarks):''}</p><div class="actions"><button class="secondary" type="button" data-school-versions="${esc(d.id)}">Versions</button>${upload?`<button type="button" data-school-upload="${esc(d.id)}">Upload ${a?'revision':'file'}</button>`:''}${submit?`<button type="button" class="secondary" data-school-submit="${esc(d.id)}">${a?'Resubmit for approval':'Submit for approval'}</button>`:''}${review?`<button type="button" data-school-review="${esc(d.id)}">Review document</button>`:''}</div><div id="schoolDocDetail-${esc(d.id)}"></div></div>`;
 }).join(''):'<div class="empty">No school documents are available.</div>';
 list.querySelectorAll('[data-school-upload]').forEach(b=>b.onclick=()=>enexusShowSchoolUpload(b.dataset.schoolUpload));
 list.querySelectorAll('[data-school-submit]').forEach(b=>b.onclick=()=>enexusSubmitSchoolDoc(b.dataset.schoolSubmit));
 list.querySelectorAll('[data-school-versions]').forEach(b=>b.onclick=()=>enexusShowSchoolVersions(b.dataset.schoolVersions));
 list.querySelectorAll('[data-school-review]').forEach(b=>b.onclick=()=>enexusShowSchoolReview(b.dataset.schoolReview));
}
async function enexusCreateSchoolDoc(e){
 e.preventDefault();const f=e.target;const b=f.querySelector('button[type=submit]');b.disabled=true;
 try{
  const {data:allowed,error:authError}=await authClient.rpc('enexus_can_submit_document',{target_school:currentUser.school_name});
  if(authError||allowed!==true)throw Error(authError?.message||'Not authorized');
  const values=Object.fromEntries(new FormData(f));
  const {error}=await authClient.from('enexus_transparency_documents').insert({...values,school_name:currentUser.school_name,created_by:currentUser.id});
  if(error)throw error;toast('Document created. Upload a file before submitting.');await enexusLoadSchoolDocs();
 }catch(err){alert('Document creation failed: '+err.message)}finally{b.disabled=false}
}
function enexusShowSchoolUpload(id){
 const d=enexusSchoolDocs.find(x=>x.id===id),a=enexusSchoolApprovals.get(id),host=document.getElementById('schoolDocDetail-'+id);if(!d||!host)return;
 if(d.created_by!==currentUser.id&& !isSystemAdmin())return;
 if(a&&a.approval_status!=='Needs Revision')return;
 host.innerHTML=`<form class="panel" data-school-upload-form="${esc(id)}" style="background:#f8fafc;margin-top:12px"><label>PDF, JPG or PNG (maximum 20 MB)</label><input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png" required><label>Revision notes (optional)</label><textarea name="remarks" rows="2"></textarea><div class="formactions"><button type="submit">Upload and register version</button></div></form>`;
 host.querySelector('form').onsubmit=e=>enexusUploadSchoolDoc(e,id);
}
async function enexusUploadSchoolDoc(e,id){
 e.preventDefault();if(enexusDocUploadBusy)return;
 const d=enexusSchoolDocs.find(x=>x.id===id),f=e.target,file=f.elements.file.files[0];if(!d||!file)return;
 const ext=file.name.split('.').pop().toLowerCase();
 const types={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png'};
 if(!types[ext]||file.type!==types[ext]||file.size<1||file.size>20*1024*1024)return alert('Choose a valid PDF/JPG/PNG file up to 20 MB.');
 const path=d.school_name+'/'+id+'/'+crypto.randomUUID()+'.'+ext;
 enexusDocUploadBusy=true;const button=f.querySelector('button[type=submit]');button.disabled=true;
 try{
  const {error:uploadError}=await authClient.storage.from(enexusSchoolDocsBucket).upload(path,file,{contentType:file.type,upsert:false});
  if(uploadError)throw uploadError;
  const {data:version,error:registerError}=await authClient.rpc('enexus_register_school_document_version',{p_document_id:id,p_storage_path:path,p_original_filename:file.name,p_revision_remarks:f.elements.remarks.value||null});
  if(registerError)throw Error('File uploaded but version registration failed: '+registerError.message+'; storage path for administrator: '+path);
  toast('Document version '+version+' uploaded. Submit it for approval when ready.');await enexusLoadSchoolDocs();
 }catch(err){alert('Upload failed: '+err.message)}finally{enexusDocUploadBusy=false;button.disabled=false}
}
async function enexusShowSchoolVersions(id){
 const host=document.getElementById('schoolDocDetail-'+id);if(!host)return;host.textContent='Loading versions…';
 const {data,error}=await authClient.rpc('enexus_get_school_document_versions',{p_document_id:id});
 if(error){host.textContent='Cannot load versions: '+error.message;return;}
 host.innerHTML='<div class="panel" style="margin-top:10px"><strong>Registered versions</strong>'+((data||[]).length?(data||[]).map(v=>`<p>Version ${esc(v.version_number)} — ${esc(v.original_filename||'File')} ${v.revision_remarks?' — '+esc(v.revision_remarks):''}</p>`).join(''):'<p>No registered versions yet.</p>')+'</div>';
}
async function enexusSubmitSchoolDoc(id){
 const a=enexusSchoolApprovals.get(id),revision=a?.approval_status==='Needs Revision';
 if(!confirm(revision?'Resubmit the latest registered version for approval?':'Submit the latest registered document version for approval?'))return;
 let args={p_document_id:id},rpc='enexus_submit_school_document';
 if(revision){const remarks=prompt('Describe the changes made (required):');if(!remarks?.trim())return;rpc='enexus_resubmit_school_document';args.p_remarks=remarks.trim();}
 const {error}=await authClient.rpc(rpc,args);
 if(error)return alert('Submission failed: '+error.message);
 toast(revision?'Revision resubmitted for approval.':'Document submitted for approval.');await enexusLoadSchoolDocs();
}
// Reviews are enforced by the existing SECURITY DEFINER RPC, including school scope,
// exact submitted version, Pending Approval status, and no self-approval.
function enexusShowSchoolReview(id){
 const d=enexusSchoolDocs.find(x=>x.id===id),a=enexusSchoolApprovals.get(id),host=document.getElementById('schoolDocDetail-'+id);
 if(!d||!a||!host||a.approval_status!=='Pending Approval'||a.submitted_by===currentUser.id)return;
 host.innerHTML=`<form class="panel" style="margin-top:12px;background:#f8fafc"><h4>Review submitted document</h4><p>Review the registered version before making a decision. You cannot approve your own submission.</p><div class="formgroup"><label>Decision</label><select name="decision" required><option value="APPROVE">Approve</option><option value="REJECT">Reject</option><option value="REQUEST REVISION">Request revision</option></select></div><div class="formgroup" style="margin-top:12px"><label>Review remarks (required for rejection or revision)</label><textarea name="remarks" rows="3"></textarea></div><div class="formactions"><button type="button" class="secondary" data-review-cancel>Cancel</button><button type="submit">Save review decision</button></div></form>`;
 const form=host.querySelector('form');
 form.querySelector('[data-review-cancel]').onclick=()=>{host.innerHTML='';};
 form.onsubmit=async e=>{
  e.preventDefault();const decision=form.elements.decision.value,remarks=form.elements.remarks.value.trim();
  if(decision!=='APPROVE'&&!remarks)return alert('Remarks are required for rejection or revision.');
  if(!confirm('Confirm '+decision.toLowerCase()+' for '+d.title+'?'))return;
  const button=form.querySelector('button[type=submit]');button.disabled=true;
  try{
   const {error}=await authClient.rpc('enexus_review_school_document',{p_document_id:id,p_decision:decision,p_remarks:remarks||null});
   if(error)throw error;
   toast('Document review saved.');await enexusLoadSchoolDocs();
  }catch(err){alert('Review failed: '+err.message);}finally{button.disabled=false;}
 };
}
// Override only the Transparency Register page, preserving all other modules.
transparencyPage=enexusSchoolDocsPage;
const enexusOriginalLoadCloudModule=loadCloudModule;
loadCloudModule=async function(p){
 if(p==='transparency'){
  const refresh=document.getElementById('schoolDocsRefresh');if(refresh)refresh.onclick=enexusLoadSchoolDocs;
  return enexusLoadSchoolDocs();
 }
 return enexusOriginalLoadCloudModule(p);
};

initAuth();
</script>
